<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>わが家の備蓄管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      overscroll-behavior: none;
      touch-action: pan-y;
      background-color: #f6f5f0;
      color: #292D2B;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    input, select, textarea {
      font-size: 16px !important;
      min-width: 0;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    button, label, [role="button"] {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .horizontal-scroll-tabs {
      display: flex;
      overflow-x: auto;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
      min-width: 0;
      max-width: 100%;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .horizontal-scroll-tabs::-webkit-scrollbar {
      display: none;
    }

    .jp-wrap {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    input[type="range"] {
      accent-color: #1B6B50;
      touch-action: pan-x;
    }
    input[type="range"].range-amber {
      accent-color: #C87D28;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }
  </style>
</head>
<body>

  <!-- トースト通知 -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-[440px] pointer-events-none flex flex-col gap-2"></div>

  <!-- メインコンテナ -->
  <div class="max-w-[480px] mx-auto min-h-screen bg-[#faf9f5] shadow-sm relative pb-24 overflow-x-hidden flex flex-col">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 w-full bg-white/95 backdrop-blur-md border-b border-stone-200/80 shadow-2xs">
      <div class="px-4 h-14 flex items-center justify-between gap-2 min-w-0">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-[#1B6B50] text-white flex items-center justify-center shadow-2xs shrink-0">
            <i data-lucide="shield-check" class="w-5 h-5"></i>
          </div>
          <h1 class="font-bold text-base tracking-tight text-stone-800 truncate">わが家の備蓄管理</h1>
        </div>
        <button onclick="switchTab('settings')" class="text-xs font-bold bg-emerald-50 text-[#1B6B50] border border-emerald-200 px-3 py-1.5 rounded-full flex items-center gap-1.5 hover:bg-emerald-100 transition active:scale-95 whitespace-nowrap shrink-0">
          <i data-lucide="users" class="w-3.5 h-3.5 shrink-0"></i>
          <span id="header-family-summary">2人 × 30日</span>
        </button>
      </div>
    </header>

    <!-- コンテンツ描画エリア -->
    <main id="app" class="px-4 pt-4 flex-1 overflow-x-hidden min-w-0">
      <!-- JSで描画 -->
    </main>

    <!-- 下部固定ナビゲーション -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 w-full bg-white border-t border-stone-200 shadow-lg pb-[env(safe-area-inset-bottom)]">
      <div class="w-full max-w-[480px] mx-auto grid grid-cols-5 h-16">
        <button onclick="switchTab('home')" data-nav="home" class="nav-btn flex flex-col items-center justify-center gap-1 text-[#1B6B50] font-semibold transition">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[11px] whitespace-nowrap">ホーム</span>
        </button>
        <button onclick="switchTab('inventory')" data-nav="inventory" class="nav-btn flex flex-col items-center justify-center gap-1 text-stone-400 hover:text-stone-600 transition">
          <i data-lucide="package" class="w-5 h-5"></i>
          <span class="text-[11px] whitespace-nowrap">備蓄一覧</span>
        </button>
        <button onclick="switchTab('expiry')" data-nav="expiry" class="nav-btn relative flex flex-col items-center justify-center gap-1 text-stone-400 hover:text-stone-600 transition">
          <i data-lucide="calendar-clock" class="w-5 h-5"></i>
          <span class="text-[11px] whitespace-nowrap">期限管理</span>
          <span id="nav-expiry-badge" class="hidden absolute top-2 right-1/4 w-2 h-2 rounded-full bg-amber-500"></span>
        </button>
        <button onclick="switchTab('shopping')" data-nav="shopping" class="nav-btn relative flex flex-col items-center justify-center gap-1 text-stone-400 hover:text-stone-600 transition">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <span class="text-[11px] whitespace-nowrap">買い物</span>
          <span id="nav-shopping-badge" class="hidden absolute top-1.5 right-1/4 bg-rose-500 text-white text-[9px] font-bold px-1.5 rounded-full">0</span>
        </button>
        <button onclick="switchTab('settings')" data-nav="settings" class="nav-btn flex flex-col items-center justify-center gap-1 text-stone-400 hover:text-stone-600 transition">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span class="text-[11px] whitespace-nowrap">設定</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- 品目追加・編集モーダル -->
  <div id="item-modal" class="fixed inset-0 z-50 hidden bg-stone-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 overscroll-contain">
    <div class="bg-white w-full max-w-[480px] rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden animate-fade-in">
      <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between bg-stone-50/70 shrink-0">
        <h3 id="modal-title" class="font-bold text-base text-stone-800">品目の編集</h3>
        <button onclick="closeItemModal()" class="p-2 rounded-full text-stone-400 hover:bg-stone-200/70 hover:text-stone-700 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-4 sm:p-5 overflow-y-auto overscroll-contain space-y-4">
        <!-- JSで描画 -->
      </div>
    </div>
  </div>

  <!-- 確認ダイアログモーダル -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden bg-stone-900/50 backdrop-blur-xs flex items-center justify-center p-4 overscroll-contain">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl space-y-4 animate-fade-in">
      <div class="flex items-center gap-3 text-amber-600">
        <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center shrink-0">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </div>
        <h4 id="confirm-title" class="font-bold text-base text-stone-800">確認</h4>
      </div>
      <p id="confirm-message" class="text-sm text-stone-600 leading-relaxed jp-wrap"></p>
      <div class="flex gap-3 pt-2">
        <button id="confirm-cancel-btn" class="flex-1 py-2.5 px-4 rounded-xl border border-stone-200 text-stone-600 font-medium text-sm hover:bg-stone-50 transition whitespace-nowrap">キャンセル</button>
        <button id="confirm-ok-btn" class="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 text-white font-medium text-sm hover:bg-rose-700 transition shadow-2xs whitespace-nowrap">実行する</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 定数・カテゴリー定義・初期データ
    // ==========================================
    const STORAGE_KEY = 'bichiku_app_v13';

    const CATEGORIES = [
      { id: 'staple', name: '主食', type: 'food', theme: 'emerald', icon: 'wheat' },
      { id: 'protein', name: 'たんぱく質', type: 'food', theme: 'emerald', icon: 'beef' },

      { id: 'fruit_dairy', name: '果物・乳製品', type: 'food', theme: 'emerald', icon: 'apple' },
      { id: 'soup_other', name: '汁物・その他食品', type: 'food', theme: 'emerald', icon: 'soup' },
      { id: 'snacks', name: 'お菓子・嗜好品', type: 'food', theme: 'amber', icon: 'cookie' },
      { id: 'water', name: '水・飲料', type: 'supply', theme: 'sky', icon: 'droplets' },
      { id: 'daily', name: '生活用品', type: 'supply', theme: 'sky', icon: 'package-check' }
    ];

    const DEFAULT_DATA = {
      settings: {
        people: 2,
        days: 30,
        mealsPerDay: 3,
        categoryRatios: {
          staple: 100,
          protein: 100,
          vegetable: 80,
          fruit_dairy: 30,
          soup_other: 50,
          snacks: 50
        }
      },
      checkedShoppingIds: [],
      items: [
        // 1) 主食 (targetRatio: 100% -> 180 meals, 合計100%)
        { id: 'st-1', category: 'staple', name: '米', isCombined: false, unit: 'kg', mealsPerUnit: 6.5, ratio: 35, stock: 8, step: 1, expiry: '' },
        { id: 'st-2', category: 'staple', name: 'パックご飯', isCombined: false, unit: '個', mealsPerUnit: 1, ratio: 15, stock: 24, step: 1, expiry: '' },
        { id: 'st-3', category: 'staple', name: 'パスタ', isCombined: false, unit: '束', mealsPerUnit: 1, ratio: 15, stock: 20, step: 1, expiry: '' },
        { id: 'st-4', category: 'staple', name: 'そうめん', isCombined: false, unit: '束', mealsPerUnit: 0.5, ratio: 10, stock: 30, step: 2, expiry: '' },
        { id: 'st-5', category: 'staple', name: '乾麺うどん', isCombined: false, unit: '束', mealsPerUnit: 1, ratio: 10, stock: 15, step: 1, expiry: '' },
        { id: 'st-6', category: 'staple', name: 'インスタント麺', isCombined: false, unit: '食', mealsPerUnit: 1, ratio: 15, stock: 15, step: 1, expiry: '' },

        // 2) たんぱく質 (targetRatio: 100% -> 180 meals, 合計100%)
        { id: 'pr-1', category: 'protein', name: 'ツナ缶', isCombined: false, unit: '缶', mealsPerUnit: 1, ratio: 35, stock: 30, step: 1, expiry: '' },
        { id: 'pr-2', category: 'protein', name: 'サバ缶', isCombined: false, unit: '缶', mealsPerUnit: 1, ratio: 30, stock: 25, step: 1, expiry: '' },
        { id: 'pr-3', category: 'protein', name: '焼き鳥缶', isCombined: false, unit: '缶', mealsPerUnit: 1, ratio: 20, stock: 18, step: 1, expiry: '' },
        { id: 'pr-4', category: 'protein', name: '大豆水煮', isCombined: false, unit: '缶', mealsPerUnit: 2, ratio: 15, stock: 10, step: 1, expiry: '' },

        // 3) 野菜・食物繊維 (targetRatio: 80% -> 144 meals, 合計100%)
        { id: 'vg-1', category: 'vegetable', name: '切り干し大根', isCombined: false, unit: '袋', mealsPerUnit: 3, ratio: 30, stock: 8, step: 1, expiry: '' },
        { id: 'vg-2', category: 'vegetable', name: 'トマト缶', isCombined: false, unit: '缶', mealsPerUnit: 2, ratio: 25, stock: 10, step: 1, expiry: '' },
        { id: 'vg-3', category: 'vegetable', name: 'コーン缶', isCombined: false, unit: '缶', mealsPerUnit: 1, ratio: 20, stock: 12, step: 1, expiry: '' },
        { id: 'vg-4', category: 'vegetable', name: '野菜ジュース', isCombined: false, unit: '本', mealsPerUnit: 1, ratio: 25, stock: 24, step: 1, expiry: '' },

        // 4) 果物・乳製品 (targetRatio: 30% -> 54 meals, 合計100%)
        { id: 'fd-1', category: 'fruit_dairy', name: '果物缶詰（みかん・桃など）', isCombined: false, unit: '缶', mealsPerUnit: 2, ratio: 65, stock: 10, step: 1, expiry: '' },
        { id: 'fd-2', category: 'fruit_dairy', name: 'ドライフルーツ', isCombined: false, unit: '袋', mealsPerUnit: 3, ratio: 35, stock: 4, step: 1, expiry: '' },

        // 5) 汁物・その他食品 (targetRatio: 50% -> 90 meals, 合計100%)
        { id: 'sp-1', category: 'soup_other', name: '即席みそ汁・スープ', isCombined: false, unit: '食', mealsPerUnit: 1, ratio: 50, stock: 30, step: 1, expiry: '' },
        { id: 'sp-2', category: 'soup_other', name: 'レトルトカレー', isCombined: false, unit: '食', mealsPerUnit: 1, ratio: 30, stock: 12, step: 1, expiry: '' },
        { id: 'sp-3', category: 'soup_other', name: '丼の素', isCombined: false, unit: '食', mealsPerUnit: 1, ratio: 20, stock: 8, step: 1, expiry: '' },

        // 6) お菓子・嗜好品 (targetRatio: 50% -> 90 times/servings, NO '日分', 合計100%)
        { id: 'sn-1', category: 'snacks', name: 'チョコレート', isCombined: false, unit: '個', mealsPerUnit: 0.5, ratio: 25, stock: 40, step: 2, expiry: '' },
        { id: 'sn-2', category: 'snacks', name: 'ビスケット・クッキー', isCombined: false, unit: '枚', mealsPerUnit: 0.5, ratio: 25, stock: 30, step: 2, expiry: '' },
        { id: 'sn-3', category: 'snacks', name: '羊羹', isCombined: false, unit: '個', mealsPerUnit: 1, ratio: 10, stock: 6, step: 1, expiry: '' },
        { id: 'sn-4', category: 'snacks', name: '飴類', isCombined: false, unit: '個', mealsPerUnit: 1, ratio: 10, stock: 15, step: 1, expiry: '' },
        { id: 'sn-5', category: 'snacks', name: 'スティックコーヒー・紅茶', isCombined: false, unit: '本', mealsPerUnit: 1, ratio: 30, stock: 25, step: 1, expiry: '' },

        // 7) 水・飲料
        {
          id: 'wt-1',
          category: 'water',
          name: '飲料水',
          isCombined: true,
          totalUnit: 'L',
          perPersonPerDay: 3,
          variants: [
            { id: 'wt-1-v1', name: '2Lペットボトル', unit: '本', factor: 2, stock: 36, step: 1, expiry: '' },
            { id: 'wt-1-v2', name: '500mLペットボトル', unit: '本', factor: 0.5, stock: 48, step: 1, expiry: '' }
          ]
        },

        // 8) 生活用品
        { id: 'dl-1', category: 'daily', name: 'トイレットペーパー', isCombined: false, unit: 'ロール', perPersonPerDay: 0.25, stock: 12, step: 1, expiry: '' },
        { id: 'dl-2', category: 'daily', name: 'ティッシュペーパー', isCombined: false, unit: '箱', perPersonPerDay: 0.1, stock: 5, step: 1, expiry: '' },
        { id: 'dl-3', category: 'daily', name: 'ウェットティッシュ', isCombined: false, unit: 'パック', perPersonPerDay: 0.15, stock: 6, step: 1, expiry: '' },
        { id: 'dl-4', category: 'daily', name: 'カセットガスボンベ', isCombined: false, unit: '本', perHouseholdPerDay: 0.5, stock: 9, step: 1, expiry: '' },
        { id: 'dl-5', category: 'daily', name: '乾電池（単3形）', isCombined: false, unit: '本', perHouseholdPerDay: 0.4, stock: 10, step: 2, expiry: '' },
        { id: 'dl-6', category: 'daily', name: '簡易トイレ・非常用トイレ', isCombined: false, unit: '回分', perPersonPerDay: 5, stock: 150, step: 10, expiry: '' },
        { id: 'dl-7', category: 'daily', name: 'ごみ袋（45L）', isCombined: false, unit: '枚', perHouseholdPerDay: 1, stock: 20, step: 5, expiry: '' }
      ]
    };

    // ==========================================
    // 2. 状態管理 & localStorage 保存・マイグレーション
    // ==========================================
    let appState = loadData();
    let currentTab = 'home';
    let selectedInventoryFilter = 'all';
    let selectedAllocationCategory = 'staple';
    let modalDraftVariants = [];

    function normalizeCategoryRatiosQuiet(items, catId) {
      const catItems = items.filter(i => i.category === catId);
      if (catItems.length === 0) return;
      const sum = catItems.reduce((s, i) => s + (Number(i.ratio) || 0), 0);
      if (sum !== 100 && sum > 0) {
        let allocated = 0;
        catItems.forEach((it, idx) => {
          if (idx === catItems.length - 1) {
            it.ratio = Math.max(0, 100 - allocated);
          } else {
            const scaled = Math.round(((Number(it.ratio) || 0) / sum) * 100);
            it.ratio = scaled;
            allocated += scaled;
          }
        });
      }
    }

    function loadData() {
      try {
        const legacyKeys = [
          STORAGE_KEY,
          'bichiku_app_v12',
          'bichiku_app_v11',
          'bichiku_app_v10',
          'bichiku_app_v9',
          'bichiku_app_v8',
          'bichiku_app_v7',
          'bichiku_app_v6',
          'wagaya_stockpile_app_v5',
          'bichiku_app_v4',
          'bichiku_app_v3',
          'bichiku_app_v2',
          'bichiku_app_v1'
        ];
        let raw = null;
        let foundKey = null;
        for (const k of legacyKeys) {
          const val = localStorage.getItem(k);
          if (val) {
            raw = val;
            foundKey = k;
            break;
          }
        }

        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.settings && Array.isArray(parsed.items)) {
            if (foundKey === STORAGE_KEY) {
              return {
                settings: {
                  people: Number(parsed.settings.people) || 2,
                  days: Number(parsed.settings.days) || 30,
                  mealsPerDay: Number(parsed.settings.mealsPerDay) || 3,
                  categoryRatios: {
                    ...DEFAULT_DATA.settings.categoryRatios,
                    ...(parsed.settings.categoryRatios || {})
                  }
                },
                checkedShoppingIds: Array.isArray(parsed.checkedShoppingIds) ? parsed.checkedShoppingIds : [],
                items: parsed.items
              };
            }

            // 旧バージョンからの自動移行処理（既存の在庫数・賞味期限・設定を保持）
            const migratedItems = [];
            parsed.items.forEach(old => {
              const name = (old.name || '').trim();
              if (
                name === 'ロングライフ牛乳' ||
                name === '保存可能ヨーグルト' ||
                name === '保存可能なヨーグルト' ||
                name.includes('ひじき') ||
                name === '乾燥わかめ・海藻'
              ) {
                return;
              }

              const stockVal = old.stock !== undefined ? Number(old.stock) : (Number(old.currentQty) || 0);
              const ratioVal = old.ratio !== undefined ? Number(old.ratio) : (Number(old.shareRatio) || 10);
              const expiryVal = old.expiry !== undefined ? old.expiry : (old.expiryDate || '');
              const isComb = Boolean(old.isCombined || old.isMultiVariant);

              // 1) トマト缶・コーン缶の分離
              if (name === 'トマト缶・コーン缶' || (name.includes('トマト缶') && name.includes('コーン缶'))) {
                const tStock = stockVal > 0 ? Math.max(1, Math.round(stockVal * 0.45)) : 10;
                const cStock = stockVal > 0 ? Math.max(1, stockVal - tStock) : 12;
                migratedItems.push({
                  id: 'vg-2', category: 'vegetable', name: 'トマト缶', isCombined: false,
                  unit: '缶', mealsPerUnit: 2, ratio: 25, stock: tStock, step: 1, expiry: expiryVal
                });
                migratedItems.push({
                  id: 'vg-3', category: 'vegetable', name: 'コーン缶', isCombined: false,
                  unit: '缶', mealsPerUnit: 1, ratio: 20, stock: cStock, step: 1, expiry: expiryVal
                });
                return;
              }

              // 2) レトルトカレー・丼の素の分離
              if (name === 'レトルトカレー・丼の素' || (name.includes('レトルトカレー') && name.includes('丼の素'))) {
                const curryStock = stockVal > 0 ? Math.ceil(stockVal * 0.6) : 12;
                const donStock = stockVal > 0 ? Math.max(0, stockVal - curryStock) : 8;
                migratedItems.push({
                  id: 'sp-2', category: 'soup_other', name: 'レトルトカレー', isCombined: false,
                  unit: '食', mealsPerUnit: 1, ratio: 30, stock: curryStock, step: 1, expiry: expiryVal
                });
                migratedItems.push({
                  id: 'sp-3', category: 'soup_other', name: '丼の素', isCombined: false,
                  unit: '食', mealsPerUnit: 1, ratio: 20, stock: donStock, step: 1, expiry: expiryVal
                });
                return;
              }

              // 3) 羊羹・飴類の分離
              if (name === '羊羹・飴類' || (name.includes('羊羹') && name.includes('飴'))) {
                const yokanStock = stockVal > 0 ? Math.max(1, Math.round(stockVal * 0.35)) : 6;
                const candyStock = stockVal > 0 ? Math.max(1, stockVal - yokanStock) : 15;
                migratedItems.push({
                  id: 'sn-3', category: 'snacks', name: '羊羹', isCombined: false,
                  unit: '個', mealsPerUnit: 1, ratio: 10, stock: yokanStock, step: 1, expiry: expiryVal
                });
                migratedItems.push({
                  id: 'sn-4', category: 'snacks', name: '飴類', isCombined: false,
                  unit: '個', mealsPerUnit: 1, ratio: 10, stock: candyStock, step: 1, expiry: expiryVal
                });
                return;
              }

              let cat = old.category;
              let newName = name;
              let unit = old.unit || '個';
              let mpu = Number(old.mealsPerUnit) || 1;
              let stk = stockVal;
              let stp = Number(old.step) || 1;

              // 4) インスタント麺を「主食」へ移動
              if (name === 'インスタント麺' || name.includes('インスタント麺')) {
                cat = 'staple';
                newName = 'インスタント麺';
                unit = '食';
                mpu = 1;
              }
              // 5) サバ・イワシ缶 → サバ缶のみ
              else if (name === 'サバ・イワシ缶' || (cat === 'protein' && name.includes('サバ'))) {
                cat = 'protein';
                newName = 'サバ缶';
                unit = '缶';
                mpu = 1;
              }
              // 6) 焼き鳥・肉缶詰 → 焼き鳥缶のみ
              else if (name === '焼き鳥・肉缶詰' || (cat === 'protein' && name.includes('焼き鳥'))) {
                cat = 'protein';
                newName = '焼き鳥缶';
                unit = '缶';
                mpu = 1;
              }
              else if (name.includes('野菜ジュース')) {
                cat = 'vegetable';
                newName = '野菜ジュース';
                unit = '本';
                mpu = 1;
              } else if (name.includes('切り干し大根')) {
                cat = 'vegetable';
                newName = '切り干し大根';
                unit = '袋';
                mpu = 3;
              } else if (cat === 'protein' && (name.includes('大豆') || old.id === 'pr-4')) {
                newName = '大豆水煮';
                unit = '缶';
                mpu = 2;
              } else if (newName === 'パスタ' || newName === '乾麺うどん') {
                unit = '束';
                mpu = 1;
              } else if (newName === 'そうめん') {
                unit = '束';
                mpu = 0.5;
                stp = 2;
              } else if (newName === 'チョコレート') {
                unit = '個';
                mpu = 0.5;
                stp = 2;
              } else if (newName === 'ビスケット・クッキー') {
                unit = '枚';
                mpu = 0.5;
                stp = 2;
              } else if (newName === 'スティックコーヒー・紅茶') {
                unit = '本';
                mpu = 1;
              }

              if (isComb && Array.isArray(old.variants)) {
                migratedItems.push({
                  id: old.id || ('item-' + Date.now() + Math.random()),
                  category: cat,
                  name: newName,
                  isCombined: true,
                  totalUnit: old.totalUnit || old.unit || 'L',
                  perPersonPerDay: old.perPersonPerDay !== undefined ? Number(old.perPersonPerDay) : (old.perPerson ? Number(old.dailyPerUnit) : undefined),
                  perHouseholdPerDay: old.perHouseholdPerDay !== undefined ? Number(old.perHouseholdPerDay) : (!old.perPerson && old.dailyPerUnit ? Number(old.dailyPerUnit) : undefined),
                  ratio: ratioVal,
                  variants: old.variants.map(v => ({
                    id: v.id || ('v-' + Date.now() + Math.random()),
                    name: v.name || '規格',
                    unit: v.unit || '本',
                    factor: Number(v.factor) || 1,
                    stock: v.stock !== undefined ? Number(v.stock) : (Number(v.qty) || 0),
                    step: Number(v.step) || 1,
                    expiry: v.expiry !== undefined ? v.expiry : (v.expiryDate || '')
                  }))
                });
              } else {
                const entry = {
                  id: old.id || ('item-' + Date.now() + Math.random()),
                  category: cat,
                  name: newName,
                  isCombined: false,
                  unit,
                  mealsPerUnit: mpu,
                  ratio: ratioVal,
                  stock: stk,
                  step: stp,
                  expiry: expiryVal
                };
                if (old.perPersonPerDay !== undefined) entry.perPersonPerDay = Number(old.perPersonPerDay);
                else if (old.perHouseholdPerDay !== undefined) entry.perHouseholdPerDay = Number(old.perHouseholdPerDay);
                else if (old.dailyPerUnit !== undefined) {
                  if (old.perPerson) entry.perPersonPerDay = Number(old.dailyPerUnit);
                  else entry.perHouseholdPerDay = Number(old.dailyPerUnit);
                }
                migratedItems.push(entry);
              }
            });

            // 移動・分離が行われたカテゴリーの合計配分を100%に整える
            ['staple', 'protein', 'vegetable', 'fruit_dairy', 'soup_other', 'snacks'].forEach(cId => {
              normalizeCategoryRatiosQuiet(migratedItems, cId);
            });

            return {
              settings: {
                people: Number(parsed.settings.people) || 2,
                days: Number(parsed.settings.days) || 30,
                mealsPerDay: Number(parsed.settings.mealsPerDay) || 3,
                categoryRatios: {
                  ...DEFAULT_DATA.settings.categoryRatios,
                  ...(parsed.settings.categoryRatios || {})
                }
              },
              checkedShoppingIds: Array.isArray(parsed.checkedShoppingIds) ? parsed.checkedShoppingIds : [],
              items: migratedItems
            };
          }
        }
      } catch (e) {
        console.error('データ読み込みエラー:', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        updateBadges();
      } catch (e) {
        showToast('データの保存に失敗しました', 'error');
      }
    }

    // ==========================================
    // 3. 計算ロジック
    // ==========================================
    function formatNum(num) {
      const val = Number(num) || 0;
      if (Number.isInteger(val)) return val.toString();
      return (Math.round(val * 10) / 10).toString();
    }

    function getBaseTargetMeals() {
      const { people, days, mealsPerDay } = appState.settings;
      return Math.max(1, (Number(people) || 1) * (Number(days) || 1) * (Number(mealsPerDay) || 1));
    }

    function getCategoryTargetMeals(catId) {
      const baseMeals = getBaseTargetMeals();
      const ratio = appState.settings.categoryRatios[catId] ?? 100;
      return Math.round(baseMeals * (ratio / 100));
    }

    function getCategoryEquivalentDays(ratio) {
      const days = Number(appState.settings.days) || 30;
      return Math.round((days * (ratio / 100)) * 10) / 10;
    }

    function getItemStats(item) {
      const { people, days } = appState.settings;
      const catObj = CATEGORIES.find(c => c.id === item.category);
      const isFood = catObj && catObj.type === 'food';
      const isCombined = Boolean(item.isCombined && Array.isArray(item.variants) && item.variants.length > 0);

      let currentTotal = 0;
      let variantBreakdown = [];

      if (isCombined) {
        variantBreakdown = item.variants.map(v => {
          const vStock = Math.max(0, Number(v.stock) || 0);
          const vFactor = Number(v.factor) || 1;
          const converted = Math.round(vStock * vFactor * 100) / 100;
          currentTotal += converted;
          return {
            ...v,
            stock: vStock,
            factor: vFactor,
            converted
          };
        });
        currentTotal = Math.round(currentTotal * 10) / 10;
      } else {
        currentTotal = Math.max(0, Number(item.stock) || 0);
      }

      if (isFood) {
        const catTargetMeals = getCategoryTargetMeals(item.category);
        const targetMeals = Math.round(catTargetMeals * ((Number(item.ratio) || 0) / 100));

        if (isCombined) {
          const currentMeals = Math.round(currentTotal);
          const diffMeals = currentMeals - targetMeals;
          return {
            isFood: true,
            isCombined: true,
            requiredQty: targetMeals,
            currentQty: currentMeals,
            targetMeals,
            currentMeals,
            diffQty: diffMeals,
            diffMeals,
            isSufficient: currentMeals >= targetMeals,
            variantBreakdown
          };
        } else {
          const mpu = Number(item.mealsPerUnit) || 1;
          const requiredQty = mpu > 0 ? Math.ceil((targetMeals / mpu) * 10) / 10 : 0;
          const currentMeals = Math.round(currentTotal * mpu);
          const diffQty = Math.round((currentTotal - requiredQty) * 10) / 10;
          const diffMeals = currentMeals - targetMeals;
          return {
            isFood: true,
            isCombined: false,
            requiredQty,
            currentQty: currentTotal,
            targetMeals,
            currentMeals,
            diffQty,
            diffMeals,
            isSufficient: currentTotal >= requiredQty,
            variantBreakdown: []
          };
        }
      } else {
        const pCount = Number(people) || 1;
        const dCount = Number(days) || 1;
        let dailyRate = 0;
        if (item.perPersonPerDay !== undefined && item.perPersonPerDay !== null) {
          dailyRate = (Number(item.perPersonPerDay) || 0) * pCount;
        } else {
          dailyRate = Number(item.perHouseholdPerDay) || 0;
        }
        const requiredQty = Math.ceil(dailyRate * dCount * 10) / 10;
        const diffQty = Math.round((currentTotal - requiredQty) * 10) / 10;
        return {
          isFood: false,
          isCombined,
          requiredQty,
          currentQty: currentTotal,
          diffQty,
          isSufficient: currentTotal >= requiredQty,
          variantBreakdown
        };
      }
    }

    function getCategorySummary(catId) {
      const catObj = CATEGORIES.find(c => c.id === catId);
      const catItems = appState.items.filter(i => i.category === catId);

      if (!catObj) {
        return { type: 'supply', rate: 100, isSufficient: true, shortageCount: 0, itemCount: 0 };
      }

      if (catObj.type === 'food') {
        const targetMeals = getCategoryTargetMeals(catId);
        const currentMeals = catItems.reduce((sum, item) => sum + getItemStats(item).currentMeals, 0);
        const shortageItemCount = catItems.filter(item => !getItemStats(item).isSufficient).length;
        const rate = targetMeals > 0 ? Math.min(100, Math.round((currentMeals / targetMeals) * 100)) : 100;
        return {
          type: 'food',
          targetMeals,
          currentMeals,
          rate,
          isSufficient: currentMeals >= targetMeals,
          shortageItemCount,
          itemCount: catItems.length
        };
      } else {
        if (catItems.length === 0) {
          return { type: 'supply', rate: 100, isSufficient: true, shortageCount: 0, itemCount: 0 };
        }
        let totalRate = 0;
        let shortageCount = 0;
        catItems.forEach(item => {
          const st = getItemStats(item);
          if (!st.isSufficient) shortageCount++;
          const itemRate = st.requiredQty > 0 ? Math.min(100, (st.currentQty / st.requiredQty) * 100) : 100;
          totalRate += itemRate;
        });
        const rate = Math.round(totalRate / catItems.length);
        return {
          type: 'supply',
          rate,
          isSufficient: shortageCount === 0,
          shortageCount,
          itemCount: catItems.length
        };
      }
    }

    function getOverallRates() {
      const foodCats = CATEGORIES.filter(cat => cat.type === 'food');
      let foodRateSum = 0;
      foodCats.forEach(cat => {
        foodRateSum += getCategorySummary(cat.id).rate;
      });
      const foodRate = foodCats.length > 0 ? Math.round(foodRateSum / foodCats.length) : 0;

      const supplyCatIds = CATEGORIES.filter(cat => cat.type === 'supply').map(cat => cat.id);
      const supplyItems = appState.items.filter(item => supplyCatIds.includes(item.category));

      if (supplyItems.length === 0) {
        return { foodRate, supplyRate: 100, totalRate: Math.round((foodRate + 100) / 2) };
      }

      let supplyRateSum = 0;
      supplyItems.forEach(item => {
        const st = getItemStats(item);
        const itemRate = st.requiredQty > 0 ? Math.min(100, (st.currentQty / st.requiredQty) * 100) : 100;
        supplyRateSum += itemRate;
      });

      const supplyRate = Math.round(supplyRateSum / supplyItems.length);
      const totalRate = Math.round((foodRate + supplyRate) / 2);
      return { foodRate, supplyRate, totalRate };
    }

    function getExpiryStatus(dateStr) {
      if (!dateStr) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const exp = new Date(dateStr);
      if (isNaN(exp.getTime())) return null;
      exp.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { level: 'expired', label: '期限切れ', days: diffDays, badgeClass: 'bg-rose-100 text-rose-800 border-rose-200' };
      } else if (diffDays <= 30) {
        return { level: 'urgent', label: `あと${diffDays}日`, days: diffDays, badgeClass: 'bg-amber-100 text-amber-800 border-amber-200' };
      } else if (diffDays <= 90) {
        return { level: 'soon', label: `あと${diffDays}日`, days: diffDays, badgeClass: 'bg-yellow-50 text-yellow-800 border-yellow-200' };
      } else {
        return { level: 'ok', label: '余裕あり', days: diffDays, badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
      }
    }

    function getShortageList() {
      return appState.items.filter(item => {
        const st = getItemStats(item);
        return !st.isSufficient;
      });
    }

    // ==========================================
    // 4. タブ遷移 & バッジ更新
    // ==========================================
    function switchTab(tabName, filterOrCatId = null, scrollToAllocation = false) {
      currentTab = tabName;
      if (filterOrCatId) {
        if (tabName === 'inventory') selectedInventoryFilter = filterOrCatId;
        if (tabName === 'settings') selectedAllocationCategory = filterOrCatId;
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isTarget = btn.dataset.nav === tabName;
        btn.classList.toggle('text-[#1B6B50]', isTarget);
        btn.classList.toggle('font-semibold', isTarget);
        btn.classList.toggle('text-stone-400', !isTarget);
      });

      renderCurrentView();

      if (scrollToAllocation) {
        setTimeout(() => {
          const el = document.getElementById('allocation-balance-section');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 60);
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToCategoryAllocation(catId) {
      closeItemModal();
      switchTab('settings', catId, true);
    }

    function updateBadges() {
      const { people, days } = appState.settings;
      const headerSummary = document.getElementById('header-family-summary');
      if (headerSummary) {
        headerSummary.textContent = `${people}人 × ${days}日`;
      }

      const shortageCount = getShortageList().length;
      const shopBadge = document.getElementById('nav-shopping-badge');
      if (shopBadge) {
        if (shortageCount > 0) {
          shopBadge.textContent = shortageCount;
          shopBadge.classList.remove('hidden');
        } else {
          shopBadge.classList.add('hidden');
        }
      }

      const allDates = [];
      appState.items.forEach(item => {
        if (item.isCombined && Array.isArray(item.variants)) {
          item.variants.forEach(v => { if (v.expiry) allDates.push(v.expiry); });
        } else if (item.expiry) {
          allDates.push(item.expiry);
        }
      });

      const hasUrgent = allDates.some(d => {
        const st = getExpiryStatus(d);
        return st && (st.level === 'expired' || st.level === 'urgent');
      });
      const expBadge = document.getElementById('nav-expiry-badge');
      if (expBadge) {
        expBadge.classList.toggle('hidden', !hasUrgent);
      }
    }

    function renderCurrentView() {
      updateBadges();
      const container = document.getElementById('app');
      if (!container) return;
      container.innerHTML = '';

      if (currentTab === 'home') renderHomeView(container);
      else if (currentTab === 'inventory') renderInventoryView(container);
      else if (currentTab === 'expiry') renderExpiryView(container);
      else if (currentTab === 'shopping') renderShoppingView(container);
      else if (currentTab === 'settings') renderSettingsView(container);

      if (window.lucide) lucide.createIcons();
    }

              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center shrink-0">
                  <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                  <div class="text-xs font-bold text-stone-800 whitespace-nowrap">買い物リスト</div>
                  <div class="text-[11px] text-stone-500 whitespace-nowrap mt-0.5">不足 ${shortageCount}品目</div>
                </div>
              </div>
            </button>
            <button onclick="switchTab('expiry')" class="bg-white p-3.5 rounded-2xl border border-stone-200/80 shadow-2xs flex items-center justify-between gap-2 hover:border-emerald-300 transition text-left min-w-0">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-amber-50 text-[#C87D28] flex items-center justify-center shrink-0">
                  <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                  <div class="text-xs font-bold text-stone-800 whitespace-nowrap">賞味期限管理</div>
