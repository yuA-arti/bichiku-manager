          <!-- カテゴリー別の備蓄状況 -->
          <section class="space-y-4">
            <div class="flex items-center justify-between px-1">
              <h2 class="font-bold text-base text-stone-800">カテゴリー別の備蓄状況</h2>
              <span class="text-xs text-stone-500 whitespace-nowrap">タップして在庫管理</span>
            </div>

            <div class="space-y-2.5">
              <div class="flex items-center gap-1.5 px-1">
                <span class="w-2 h-2 rounded-full bg-[#1B6B50] shrink-0"></span>
                <span class="text-xs font-bold text-[#1B6B50] whitespace-nowrap">食材・嗜好品系（食数・回数管理）</span>
              </div>
              <div class="space-y-2">
                ${foodCats.map(buildCategoryCard).join('')}
              </div>
            </div>

            <div class="space-y-2.5 pt-1">
              <div class="flex items-center gap-1.5 px-1">
                <span class="w-2 h-2 rounded-full bg-[#1E6B9B] shrink-0"></span>
                <span class="text-xs font-bold text-[#1E6B9B] whitespace-nowrap">水・生活用品系（数量管理）</span>
              </div>
              <div class="space-y-2">
                ${supplyCats.map(buildCategoryCard).join('')}
              </div>
            </div>
          </section>
        </div>
      `;
    }

    // ==========================================
    // 6. [画面2] 備蓄一覧画面
    // ==========================================
    function renderInventoryView(container) {
      const isAll = selectedInventoryFilter === 'all';
      const activeCat = !isAll ? (CATEGORIES.find(c => c.id === selectedInventoryFilter) || CATEGORIES[0]) : null;
      const visibleItems = isAll
        ? appState.items
        : appState.items.filter(i => i.category === activeCat.id);

      const allTabStyle = isAll
        ? 'bg-stone-800 text-white shadow-2xs'
        : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50';

      const tabsHtml = `
        <button onclick="switchTab('inventory', 'all')"
          class="px-3.5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition shrink-0 ${allTabStyle}">
          すべて
        </button>
      ` + CATEGORIES.map(cat => {
        const isSelected = !isAll && cat.id === activeCat.id;
        let activeStyle = '';
        if (isSelected) {
          if (cat.type === 'food') {
            activeStyle = cat.theme === 'amber'
              ? 'bg-[#C87D28] text-white shadow-2xs'
              : 'bg-[#1B6B50] text-white shadow-2xs';
          } else {
            activeStyle = 'bg-[#1E6B9B] text-white shadow-2xs';
          }
        } else {
          if (cat.type === 'food') {
            activeStyle = cat.theme === 'amber'
              ? 'bg-amber-50/70 text-[#C87D28] border border-amber-200/80 hover:bg-amber-100/60'
              : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50';
          } else {
            activeStyle = 'bg-sky-50/80 text-[#1E6B9B] border border-sky-200/90 hover:bg-sky-100/70';
          }
        }
        return `
          <button onclick="switchTab('inventory', '${cat.id}')"
            class="px-3.5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition shrink-0 ${activeStyle}">
            ${cat.name}
          </button>
        `;
      }).join('');

      let catBannerHtml = '';
      if (activeCat) {
        const summary = getCategorySummary(activeCat.id);
        const isAmberCat = activeCat.theme === 'amber';

        if (summary.type === 'food') {
          const ratio = appState.settings.categoryRatios[activeCat.id] ?? 100;
          const diffMeals = summary.currentMeals - summary.targetMeals;
          const unitStr = isAmberCat ? '回' : '食';
          const diffText = diffMeals >= 0
            ? `<span class="text-[#1B6B50] font-bold whitespace-nowrap">余裕 +${diffMeals}${unitStr}</span>`
            : `<span class="text-rose-600 font-bold whitespace-nowrap">あと ${Math.abs(diffMeals)}${unitStr}</span>`;
          const catBadge = summary.isSufficient
            ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-[#1B6B50] whitespace-nowrap shrink-0">カテゴリー充足達成！</span>`
            : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700 whitespace-nowrap shrink-0">不足あり</span>`;

          const bannerBorder = isAmberCat ? 'bg-amber-50/45 border-amber-200/80' : 'bg-white border-stone-200/80';
          const allocBtnStyle = isAmberCat
            ? 'bg-amber-100/80 text-[#C87D28] border-amber-300 hover:bg-amber-200/70'
            : 'bg-emerald-50 text-[#1B6B50] border-emerald-200 hover:bg-emerald-100';

          const helperNote = summary.isSufficient
            ? `カテゴリー全体の合計${unitStr}数を満たしています`
            : `目標${unitStr}数まであと ${Math.abs(diffMeals)}${unitStr}です`;

          catBannerHtml = `
            <div class="${bannerBorder} rounded-2xl p-4 border shadow-2xs space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-medium text-stone-500 whitespace-nowrap">カテゴリー必要量（基本の${ratio}%）</span>
                ${catBadge}
              </div>
              <div class="flex items-baseline justify-between gap-2 flex-wrap">
                <div class="text-base font-bold text-stone-800 whitespace-nowrap">
                  現在 <span class="${summary.isSufficient ? 'text-[#1B6B50]' : 'text-rose-600'}">${summary.currentMeals}${unitStr}</span> / 必要 ${summary.targetMeals}${unitStr}
                </div>
                <div class="text-sm shrink-0">
                  ${diffText}
                </div>
              </div>
              <div class="pt-2.5 border-t border-stone-200/60 flex items-center justify-between gap-2">
                <span class="text-[11px] text-stone-500 leading-snug jp-wrap">${helperNote}</span>
                <button onclick="jumpToCategoryAllocation('${activeCat.id}')" class="px-2.5 py-1 rounded-lg border ${allocBtnStyle} text-[11px] font-bold transition flex items-center gap-1 whitespace-nowrap shrink-0">
                  <i data-lucide="sliders" class="w-3 h-3 shrink-0"></i>
                  <span>配分調整</span>
                </button>
              </div>
            </div>
          `;
        } else {
          catBannerHtml = `
            <div class="bg-sky-50/90 rounded-2xl p-4 border border-sky-200/90 shadow-2xs space-y-1.5">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs text-[#1E6B9B] font-medium whitespace-nowrap">水・生活用品（${appState.settings.people}人・${appState.settings.days}日基準）</span>
                ${summary.isSufficient
                  ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-sky-200/80 text-[#1E6B9B] whitespace-nowrap shrink-0">カテゴリー充足達成！</span>`
                  : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700 whitespace-nowrap shrink-0">不足 ${summary.shortageCount}品目</span>`
                }
              </div>
              <div class="text-base font-bold text-sky-950 whitespace-nowrap">${activeCat.name}の備蓄状況</div>
            </div>
          `;
        }
      }

      const renderItemCard = (item) => {
        const catObj = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[0];
        const isAmberCat = catObj.theme === 'amber';
        const st = getItemStats(item);
        const unitMealText = isAmberCat ? '回' : '食';
        const baseUnitStr = st.isFood ? unitMealText : (item.totalUnit || item.unit);

        const catBadgeHtml = isAll
          ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-stone-100 text-stone-600 whitespace-nowrap shrink-0">${catObj.name}</span>`
          : '';

        if (st.isCombined) {
          let cardBorder = 'border-emerald-300/85';
          let badgeBg = 'bg-emerald-100 text-[#1B6B50]';
          let accentText = 'text-[#1B6B50]';
          let subBoxBg = 'bg-emerald-50/65 border-emerald-200/80';
          let plusBg = 'bg-[#1B6B50] hover:bg-emerald-900';

          if (!st.isFood) {
            cardBorder = 'border-sky-300/85';
            badgeBg = 'bg-sky-100 text-[#1E6B9B]';
            accentText = 'text-[#1E6B9B]';
            subBoxBg = 'bg-sky-50/75 border-sky-200/80';
            plusBg = 'bg-[#1E6B9B] hover:bg-sky-800';
          } else if (isAmberCat) {
            cardBorder = 'border-amber-300/85';
            badgeBg = 'bg-amber-100 text-[#C87D28]';
            accentText = 'text-[#C87D28]';
            subBoxBg = 'bg-amber-50/65 border-amber-200/80';
            plusBg = 'bg-[#C87D28] hover:bg-amber-700';
          }

          const multiStatusBadge = st.isSufficient
            ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold ${badgeBg} whitespace-nowrap shrink-0">充足</span>`
            : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700 whitespace-nowrap shrink-0">不足</span>`;

          const multiDiffDisplay = st.diffQty >= 0
            ? `<span class="${accentText} font-bold whitespace-nowrap">余裕：+${formatNum(st.diffQty)}${baseUnitStr}</span>`
            : `<span class="text-rose-600 font-bold whitespace-nowrap">あと ${formatNum(Math.abs(st.diffQty))}${baseUnitStr} 不足</span>`;

          const variantsRowsHtml = st.variantBreakdown.map(v => {
            const expV = getExpiryStatus(v.expiry);
            return `
              <div class="${subBoxBg} rounded-xl p-3 border space-y-2 min-w-0">
                <div class="flex items-center justify-between gap-2 min-w-0">
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="font-bold text-stone-800 text-sm whitespace-nowrap">${v.name}</span>
                      <span class="text-xs font-bold ${accentText} bg-white px-2 py-0.5 rounded-md border border-stone-200/80 whitespace-nowrap shrink-0">${formatNum(v.converted)}${baseUnitStr}分</span>
                    </div>
                    <div class="mt-1 flex items-center gap-1.5 flex-wrap">
                      <span class="text-xs text-stone-600 whitespace-nowrap">現在：<strong class="text-stone-900 text-sm">${formatNum(v.stock)}${v.unit}</strong></span>
                      ${expV ? `
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border whitespace-nowrap shrink-0 ${expV.badgeClass}">
                          ${expV.label}
                        </span>
                      ` : ''}
                    </div>
                  </div>
                  <div class="flex items-center bg-white rounded-xl p-1 border border-stone-200 shrink-0 shadow-2xs">
                    <button onclick="adjustVariantStock('${item.id}', '${v.id}', -${v.step || 1})" class="w-8 h-8 rounded-lg bg-stone-50 text-stone-700 font-bold flex items-center justify-center hover:bg-stone-100 active:scale-90 transition shrink-0" aria-label="減らす">
                      <i data-lucide="minus" class="w-4 h-4"></i>
                    </button>
                    <button onclick="adjustVariantStock('${item.id}', '${v.id}', ${v.step || 1})" class="w-8 h-8 rounded-lg ${plusBg} text-white font-bold flex items-center justify-center ml-1 active:scale-90 transition shrink-0" aria-label="増やす">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                <!-- 規格ごとのインライン賞味期限＆クリアボタン -->
                <div class="flex items-center gap-1.5 pt-1 border-t border-black/5 min-w-0">
                  <span class="text-[11px] text-stone-500 whitespace-nowrap shrink-0">期限:</span>
                  <input type="date" value="${v.expiry || ''}" onchange="updateVariantExpiryInline('${item.id}', '${v.id}', this.value)"
                    class="flex-1 min-w-0 bg-white border border-stone-200 rounded-lg px-2 py-1 text-xs font-medium text-stone-700">
                  <button type="button" onclick="clearVariantExpiry('${item.id}', '${v.id}')"
                    class="px-2 py-1 rounded-lg bg-white hover:bg-rose-50 text-stone-500 hover:text-rose-600 border border-stone-200 text-[11px] font-bold whitespace-nowrap shrink-0 transition">
                    × クリア
                  </button>
                </div>
              </div>
            `;
          }).join('');

          const footerRuleHtml = st.isFood
            ? `
              <div class="text-[11px] text-stone-400 pt-1.5 border-t border-stone-100 flex items-center justify-between gap-2">
                <span class="whitespace-nowrap">複数規格の合算管理</span>
                <button onclick="jumpToCategoryAllocation('${item.category}')" class="${accentText} font-medium hover:underline whitespace-nowrap shrink-0">
                  配分比率：${item.ratio || 0}%（変更）
                </button>
              </div>
            `
            : `
              <div class="text-[11px] text-[#1E6B9B]/80 pt-1.5 border-t border-sky-100">
                <span class="whitespace-nowrap">基準：${item.perPersonPerDay !== undefined ? `1人1日 ${formatNum(item.perPersonPerDay)}${baseUnitStr}` : `1世帯1日 ${formatNum(item.perHouseholdPerDay || 0)}${baseUnitStr}`}</span>
              </div>
            `;

          return `
            <div class="bg-white rounded-2xl p-4 border-2 ${cardBorder} shadow-2xs space-y-3 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    ${catBadgeHtml}
                    <h3 class="font-bold text-stone-900 text-base">${item.name}</h3>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${badgeBg} whitespace-nowrap shrink-0">複数規格合算</span>
                    ${multiStatusBadge}
                  </div>
                  <div class="mt-2 flex flex-wrap items-baseline gap-x-3 gap-y-1">
                    <div class="text-sm font-bold text-stone-800 whitespace-nowrap">
                      合計：<span class="text-xl ${st.isSufficient ? accentText : 'text-rose-600'}">${formatNum(st.currentQty)}${baseUnitStr}</span> / 必要 ${formatNum(st.requiredQty)}${baseUnitStr}
                    </div>
                    <div class="text-xs">
                      ${multiDiffDisplay}
                    </div>
                  </div>
                </div>
                <button onclick="openItemModal('${item.id}')" class="text-[11px] ${accentText} font-bold bg-stone-50 hover:bg-stone-100 border border-stone-200 px-2.5 py-1.5 rounded-xl flex items-center gap-1 whitespace-nowrap shrink-0">
                  <i data-lucide="edit-3" class="w-3 h-3 shrink-0"></i>
                  <span>編集</span>
                </button>
              </div>

              <div class="space-y-2">
                ${variantsRowsHtml}
              </div>

              ${footerRuleHtml}
            </div>
          `;
        }

        // 通常品目カード
        const statusBadge = st.isSufficient
          ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold whitespace-nowrap shrink-0 ${st.isFood ? 'bg-emerald-100 text-[#1B6B50]' : 'bg-sky-100 text-[#1E6B9B]'}">充足</span>`
          : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold whitespace-nowrap shrink-0 bg-rose-100 text-rose-700">不足</span>`;

        const expStatus = getExpiryStatus(item.expiry);
        const expBadge = expStatus
          ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border whitespace-nowrap shrink-0 ${expStatus.badgeClass}">${expStatus.label}</span>`
          : '';

        const unitMealFullText = isAmberCat ? '回分' : '食';

        let diffDisplay = '';
        if (st.isFood) {
          if (st.diffQty >= 0) {
            diffDisplay = `<span class="text-[#1B6B50] font-bold whitespace-nowrap">余裕：+${formatNum(st.diffQty)}${item.unit}（約+${st.diffMeals}${unitMealFullText}）</span>`;
          } else {
            diffDisplay = `<span class="text-rose-600 font-bold whitespace-nowrap">不足：${formatNum(Math.abs(st.diffQty))}${item.unit}（約${Math.abs(st.diffMeals)}${unitMealFullText}）</span>`;
          }
        } else {
          if (st.diffQty >= 0) {
            diffDisplay = `<span class="text-[#1E6B9B] font-bold whitespace-nowrap">余裕：+${formatNum(st.diffQty)}${item.unit}</span>`;
          } else {
            diffDisplay = `<span class="text-rose-600 font-bold whitespace-nowrap">不足：${formatNum(Math.abs(st.diffQty))}${item.unit}</span>`;
          }
        }

        const convBoxBg = isAmberCat ? 'bg-amber-50/60' : 'bg-emerald-50/60';
        const convTextColor = isAmberCat ? 'text-[#C87D28]' : 'text-[#1B6B50]';
        const shareLinkColor = isAmberCat ? 'text-[#C87D28]' : 'text-[#1B6B50]';

        const mealConversionHtml = st.isFood
          ? `
            <div class="grid grid-cols-2 gap-2 pt-2.5 mt-2.5 border-t border-stone-100 text-xs">
              <div class="bg-stone-50 px-3 py-2 rounded-xl min-w-0">
                <span class="text-stone-500 block text-[11px] whitespace-nowrap">${isAmberCat ? '必要回数' : '必要食数'}</span>
                <span class="font-bold text-stone-700 text-sm whitespace-nowrap">約${st.targetMeals}${unitMealFullText}</span>
              </div>
              <div class="${convBoxBg} px-3 py-2 rounded-xl min-w-0">
                <span class="text-stone-500 block text-[11px] whitespace-nowrap">${isAmberCat ? '現在庫の換算回数' : '現在庫の換算食数'}</span>
                <span class="font-bold ${convTextColor} text-sm whitespace-nowrap">約${st.currentMeals}${unitMealFullText}</span>
              </div>
            </div>
            <div class="text-[11px] text-stone-400 mt-1.5 flex items-center justify-between gap-2">
              <span class="truncate">換算基準：1${item.unit} ＝ ${formatNum(item.mealsPerUnit)}${unitMealFullText}</span>
              <button onclick="jumpToCategoryAllocation('${item.category}')" class="${shareLinkColor} font-medium hover:underline whitespace-nowrap shrink-0">
                配分比率：${item.ratio || 0}%（変更）
              </button>
            </div>
          `
          : `
            <div class="text-[11px] text-[#1E6B9B]/75 mt-2 pt-2 border-t border-sky-100 flex items-center justify-between">
              <span class="whitespace-nowrap">基準：${item.perPersonPerDay !== undefined ? `1人1日 ${formatNum(item.perPersonPerDay)}${item.unit}` : `1世帯1日 ${formatNum(item.perHouseholdPerDay || 0)}${item.unit}`}</span>
            </div>
          `;

        let itemCardBg = 'bg-white border-stone-200/80';
        let plusBtnColor = 'bg-[#1B6B50] hover:bg-emerald-900';
        if (!st.isFood) {
          itemCardBg = 'bg-white border-sky-200/80';
          plusBtnColor = 'bg-[#1E6B9B] hover:bg-sky-800';
        } else if (isAmberCat) {
          itemCardBg = 'bg-white border-amber-200/80';
          plusBtnColor = 'bg-[#C87D28] hover:bg-amber-700';
        }

        return `
          <div class="${itemCardBg} rounded-2xl p-4 border shadow-2xs transition hover:border-stone-300 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <div onclick="openItemModal('${item.id}')" class="cursor-pointer flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${catBadgeHtml}
                  <h3 class="font-bold text-stone-800 text-base">${item.name}</h3>
                  ${statusBadge}
                  ${expBadge}
                </div>
                <div class="mt-1.5 flex flex-wrap items-baseline gap-x-3 gap-y-1 text-sm">
                  <div class="whitespace-nowrap">
                    <span class="text-xs text-stone-500">必要量：</span>
                    <span class="font-bold text-stone-700">${formatNum(st.requiredQty)}${item.unit}</span>
                  </div>
                  <div class="whitespace-nowrap">
                    <span class="text-xs text-stone-500">現在庫：</span>
                    <span class="font-bold text-lg text-stone-900">${formatNum(st.currentQty)}${item.unit}</span>
                  </div>
                </div>
                <div class="text-xs mt-1">
                  ${diffDisplay}
                </div>
              </div>

              <div class="flex flex-col items-end gap-2 shrink-0">
                <div class="flex items-center bg-stone-100 rounded-xl p-1 border border-stone-200/70">
                  <button onclick="adjustStock('${item.id}', -${item.step || 1})" class="w-8 h-8 rounded-lg bg-white text-stone-700 font-bold shadow-2xs flex items-center justify-center hover:bg-stone-50 active:scale-90 transition shrink-0" aria-label="減らす">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                  </button>
                  <button onclick="adjustStock('${item.id}', ${item.step || 1})" class="w-8 h-8 rounded-lg ${plusBtnColor} text-white font-bold shadow-2xs flex items-center justify-center ml-1 active:scale-90 transition shrink-0" aria-label="増やす">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                  </button>
                </div>
                <button onclick="openItemModal('${item.id}')" class="text-[11px] text-stone-500 hover:text-[#1B6B50] flex items-center gap-0.5 px-1 whitespace-nowrap">
                  <i data-lucide="edit-3" class="w-3 h-3 shrink-0"></i>詳細・編集
                </button>
              </div>
            </div>

            <!-- インライン賞味期限ピッカー＆クリアボタン -->
            <div class="mt-2.5 pt-2.5 border-t border-stone-100 flex items-center gap-1.5 min-w-0">
              <span class="text-[11px] text-stone-500 whitespace-nowrap shrink-0">期限:</span>
              <input type="date" value="${item.expiry || ''}" onchange="updateItemExpiryInline('${item.id}', this.value)"
                class="flex-1 min-w-0 bg-stone-50 border border-stone-200 rounded-lg px-2 py-1 text-xs font-medium text-stone-700">
              <button type="button" onclick="clearItemExpiry('${item.id}')"
                class="px-2 py-1 rounded-lg bg-stone-50 hover:bg-rose-50 text-stone-500 hover:text-rose-600 border border-stone-200 text-[11px] font-bold whitespace-nowrap shrink-0 transition">
                × クリア
              </button>
            </div>

            ${mealConversionHtml}
          </div>
        `;
      };

      const itemsHtml = visibleItems.length === 0
        ? `<div class="bg-white rounded-2xl p-8 text-center border border-dashed border-stone-300 text-stone-500 text-sm jp-wrap">該当する品目がありません。</div>`
        : visibleItems.map(renderItemCard).join('');

      const addTargetCatId = activeCat ? activeCat.id : 'staple';
      const addTargetLabel = activeCat ? `「${activeCat.name}」に品目を追加` : '新しい品目を追加';
      let addBtnStyle = 'border-[#1B6B50]/40 text-[#1B6B50] bg-emerald-50/40 hover:bg-emerald-50';
      if (activeCat && activeCat.type !== 'food') {
        addBtnStyle = 'border-[#1E6B9B]/40 text-[#1E6B9B] bg-sky-50/60 hover:bg-sky-100/60';
      } else if (activeCat && activeCat.theme === 'amber') {
        addBtnStyle = 'border-[#C87D28]/40 text-[#C87D28] bg-amber-50/50 hover:bg-amber-100/60';
      }

      container.innerHTML = `
        <div class="space-y-4 animate-fade-in min-w-0">
          <div class="horizontal-scroll-tabs gap-2 pb-1">
            ${tabsHtml}
          </div>

          ${catBannerHtml}

          <div class="space-y-3">
            ${itemsHtml}
          </div>

          <button onclick="openItemModal(null, '${addTargetCatId}')" class="w-full py-3.5 rounded-2xl border-2 border-dashed ${addBtnStyle} font-bold text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
            <i data-lucide="plus-circle" class="w-5 h-5 shrink-0"></i>
            <span>${addTargetLabel}</span>
          </button>
        </div>
      `;
    }

    function adjustStock(itemId, delta) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item) return;
      item.stock = Math.max(0, Math.round(((Number(item.stock) || 0) + delta) * 10) / 10);
      saveData();
      renderCurrentView();
    }

    function adjustVariantStock(itemId, variantId, delta) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item || !Array.isArray(item.variants)) return;
      const variant = item.variants.find(v => v.id === variantId);
      if (!variant) return;
      variant.stock = Math.max(0, Math.round(((Number(variant.stock) || 0) + delta) * 10) / 10);
      saveData();
      renderCurrentView();
    }

    function updateItemExpiryInline(itemId, dateVal) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item) return;
      item.expiry = dateVal || '';
      saveData();
      renderCurrentView();
      if (dateVal) showToast(`「${item.name}」の賞味期限を設定しました`);
    }

    function updateVariantExpiryInline(itemId, variantId, dateVal) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item || !Array.isArray(item.variants)) return;
      const variant = item.variants.find(v => v.id === variantId);
      if (!variant) return;
      variant.expiry = dateVal || '';
      saveData();
      renderCurrentView();
      if (dateVal) showToast(`「${item.name}（${variant.name}）」の賞味期限を設定しました`);
    }

    function clearItemExpiry(itemId) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item) return;
      item.expiry = '';
      saveData();
      renderCurrentView();
      showToast(`「${item.name}」の賞味期限をクリアしました`);
    }

    function clearVariantExpiry(itemId, variantId) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item || !Array.isArray(item.variants)) return;
      const variant = item.variants.find(v => v.id === variantId);
      if (!variant) return;
      variant.expiry = '';
      saveData();
      renderCurrentView();
      showToast(`「${item.name}（${variant.name}）」の賞味期限をクリアしました`);
    }

    // ==========================================
    // 7. [画面3] 賞味期限管理画面
    // ==========================================
    function renderExpiryView(container) {
      const entries = [];
      appState.items.forEach(item => {
        const catObj = CATEGORIES.find(c => c.id === item.category);
        const isFood = catObj && catObj.type === 'food';
        const isAmber = catObj && catObj.theme === 'amber';
        const baseUnitLabel = isFood ? (isAmber ? '回分' : '食') : (item.totalUnit || item.unit);

        if (item.isCombined && Array.isArray(item.variants)) {
          item.variants.forEach(v => {
            const converted = Math.round((Number(v.stock) || 0) * (Number(v.factor) || 1) * 10) / 10;
            entries.push({
              itemId: item.id,
              variantId: v.id,
              category: item.category,
              name: `${item.name}（${v.name}）`,
              stockLabel: `${formatNum(v.stock)}${v.unit}（${formatNum(converted)}${baseUnitLabel}）`,
              expiry: v.expiry || ''
            });
          });
        } else {
          entries.push({
            itemId: item.id,
            variantId: null,
            category: item.category,
            name: item.name,
            stockLabel: `${formatNum(item.stock)}${item.unit}`,
            expiry: item.expiry || ''
          });
        }
      });

      const itemsWithExpiry = entries
        .filter(e => e.expiry && e.expiry.trim() !== '')
        .sort((a, b) => new Date(a.expiry) - new Date(b.expiry));

      const itemsWithoutExpiry = entries
        .filter(e => !e.expiry || e.expiry.trim() === '');

      let listHtml = '';
      if (itemsWithExpiry.length === 0) {
        listHtml = `
          <div class="bg-white rounded-2xl p-8 text-center border border-stone-200 text-stone-500 text-sm jp-wrap">
            賞味期限が登録されている品目がありません。<br>下の未登録リストまたは備蓄一覧から期限を設定できます。
          </div>
        `;
      } else {
        listHtml = itemsWithExpiry.map(entry => {
          const catObj = CATEGORIES.find(c => c.id === entry.category);
          const expStatus = getExpiryStatus(entry.expiry);
          if (!expStatus) return '';
          let catBadgeStyle = 'bg-stone-100 text-stone-600';
          if (catObj && catObj.theme === 'sky') catBadgeStyle = 'bg-sky-50 text-[#1E6B9B]';
          else if (catObj && catObj.theme === 'amber') catBadgeStyle = 'bg-amber-50 text-[#C87D28]';

          const dateChangeAction = entry.variantId
            ? `updateVariantExpiryInline('${entry.itemId}', '${entry.variantId}', this.value)`
            : `updateItemExpiryInline('${entry.itemId}', this.value)`;

          const clearAction = entry.variantId
            ? `clearVariantExpiry('${entry.itemId}', '${entry.variantId}')`
            : `clearItemExpiry('${entry.itemId}')`;

          return `
            <div class="bg-white p-4 rounded-2xl border border-stone-200/80 shadow-2xs space-y-2.5 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-[11px] font-medium px-2 py-0.5 rounded-md whitespace-nowrap shrink-0 ${catBadgeStyle}">${catObj ? catObj.name : ''}</span>
                    <span class="inline-flex items-center text-xs font-bold px-2.5 py-0.5 rounded-full border whitespace-nowrap shrink-0 ${expStatus.badgeClass}">${expStatus.label}</span>
                  </div>
                  <div class="font-bold text-stone-800 text-base mt-1.5 truncate">${entry.name}</div>
                  <div class="text-xs text-stone-500 mt-0.5 whitespace-nowrap">
                    現在庫：${entry.stockLabel}
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-1.5 pt-2 border-t border-stone-100 min-w-0">
                <span class="text-[11px] text-stone-500 whitespace-nowrap shrink-0">期限:</span>
                <input type="date" value="${entry.expiry}" onchange="${dateChangeAction}"
                  class="flex-1 min-w-0 bg-stone-50 border border-stone-200 rounded-lg px-2.5 py-1.5 text-xs font-medium text-stone-800">
                <button type="button" onclick="${clearAction}"
                  class="px-2.5 py-1.5 rounded-lg bg-stone-50 hover:bg-rose-50 text-stone-500 hover:text-rose-600 border border-stone-200 text-xs font-bold whitespace-nowrap shrink-0 transition">
                  × クリア
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      container.innerHTML = `
        <div class="space-y-4 animate-fade-in min-w-0">
          <div class="bg-white p-4 rounded-2xl border border-stone-200/80 shadow-2xs">
            <h2 class="font-bold text-stone-800 text-base flex items-center gap-2">
              <i data-lucide="calendar-clock" class="w-5 h-5 text-[#C87D28] shrink-0"></i>
              <span>賞味期限が近い順</span>
            </h2>
            <p class="text-xs text-stone-500 mt-1 jp-wrap">
              一番早い賞味期限を登録しておくと、食べながら買い足す（ローリングストック）管理に役立ちます。
            </p>
          </div>

          <div class="space-y-2.5">
            ${listHtml}
          </div>

          ${itemsWithoutExpiry.length > 0 ? `
            <div class="pt-3">
              <h3 class="text-xs font-bold text-stone-500 mb-2 px-1">期限未登録の品目（${itemsWithoutExpiry.length}件）</h3>
              <div class="bg-white rounded-2xl border border-stone-200/80 divide-y divide-stone-100">
                ${itemsWithoutExpiry.map(entry => {
                  const dateChangeAction = entry.variantId
                    ? `updateVariantExpiryInline('${entry.itemId}', '${entry.variantId}', this.value)`
                    : `updateItemExpiryInline('${entry.itemId}', this.value)`;
                  return `
                    <div class="px-4 py-3 flex items-center justify-between gap-2 min-w-0">
                      <span class="text-sm text-stone-700 font-medium truncate flex-1 min-w-0">${entry.name}</span>
                      <input type="date" onchange="${dateChangeAction}"
                        class="w-36 shrink-0 bg-stone-50 border border-stone-200 rounded-lg px-2 py-1 text-xs text-stone-700">
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ==========================================
    // 8. [画面4] 買い物リスト画面
    // ==========================================
    function renderShoppingView(container) {
      const shortageItems = getShortageList();

      if (shortageItems.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl p-8 text-center border border-stone-200/80 shadow-2xs space-y-3 animate-fade-in">
            <div class="w-16 h-16 rounded-full bg-emerald-100 text-[#1B6B50] flex items-center justify-center mx-auto">
              <i data-lucide="check-circle-2" class="w-9 h-9"></i>
            </div>
            <h2 class="font-bold text-lg text-stone-800">不足している備蓄品はありません！</h2>
            <p class="text-xs text-stone-500 leading-relaxed jp-wrap">
              すべての品目が目標数量を満たしています。<br>素晴らしい備蓄状態です。
            </p>
          </div>
        `;
        return;
      }

      let groupsHtml = '';
      CATEGORIES.forEach(cat => {
        const catShortages = shortageItems.filter(i => i.category === cat.id);
        if (catShortages.length === 0) return;

        const isAmber = cat.theme === 'amber';
        let headerBg = 'bg-stone-50 text-stone-700';
        let iconColor = 'text-[#1B6B50]';
        if (cat.theme === 'sky') {
          headerBg = 'bg-sky-50 text-[#1E6B9B]';
          iconColor = 'text-[#1E6B9B]';
        } else if (isAmber) {
          headerBg = 'bg-amber-50 text-[#C87D28]';
          iconColor = 'text-[#C87D28]';
        }

        const rowsHtml = catShortages.map(item => {
          const st = getItemStats(item);
          const needQtyNum = Math.round(Math.abs(st.diffQty) * 10) / 10;
          const isChecked = appState.checkedShoppingIds.includes(item.id);

          // 複数サイズ・規格合算品目の買い物行
          if (st.isCombined) {
            const baseUnitStr = st.isFood ? (isAmber ? '回' : '食') : (item.totalUnit || item.unit);
            const guideParts = st.variantBreakdown.map(v => {
              const estCount = v.factor > 0 ? Math.ceil(needQtyNum / v.factor) : 0;
              return `${v.name}なら約${estCount}${v.unit}`;
            }).join(' ／ ');

            const variantInputsHtml = st.variantBreakdown.map((v, idx) => {
              const defaultVal = idx === 0 && v.factor > 0 ? Math.ceil(needQtyNum / v.factor) : 0;
              return `
                <div class="flex items-center justify-between gap-2 min-w-0">
                  <span class="text-xs font-bold text-stone-700 truncate">${v.name}</span>
                  <div class="inline-flex items-center bg-white rounded-xl p-0.5 border border-stone-200 shrink-0">
                    <button type="button" onclick="stepMultiShopInput('${item.id}', '${v.id}', -${v.step || 1})"
                      class="w-7 h-7 rounded-lg bg-stone-50 text-stone-700 font-bold flex items-center justify-center hover:bg-stone-100 active:scale-90 transition shrink-0">
                      <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                    </button>
                    <input type="number" id="shop-multi-${item.id}-${v.id}" min="0" step="any" value="${defaultVal}"
                      class="w-12 min-w-0 shrink-0 bg-transparent text-center font-bold text-stone-800 focus:outline-none px-0.5">
                    <span class="text-[11px] font-medium text-stone-500 pr-1 whitespace-nowrap shrink-0">${v.unit}</span>
                    <button type="button" onclick="stepMultiShopInput('${item.id}', '${v.id}', ${v.step || 1})"
                      class="w-7 h-7 rounded-lg bg-stone-50 text-stone-700 font-bold flex items-center justify-center hover:bg-stone-100 active:scale-90 transition shrink-0">
                      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('');

            const btnColor = st.isFood ? 'bg-[#1B6B50] hover:bg-emerald-900' : 'bg-[#1E6B9B] hover:bg-sky-800';
            const rowBg = st.isFood ? 'bg-emerald-50/25' : 'bg-sky-50/35';

            return `
              <div class="p-3.5 ${isChecked ? 'opacity-65 bg-stone-50' : rowBg} space-y-3 transition min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <label class="flex items-start gap-2.5 cursor-pointer flex-1 min-w-0">
                    <input type="checkbox" onchange="toggleShoppingCheck('${item.id}')" ${isChecked ? 'checked' : ''}
                      class="mt-0.5 w-5 h-5 rounded-md border-stone-300 text-[#1B6B50] cursor-pointer shrink-0">
                    <div class="min-w-0">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-bold text-stone-800 text-sm ${isChecked ? 'line-through text-stone-400' : ''}">${item.name}</span>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white border border-stone-200 text-stone-600 whitespace-nowrap shrink-0">合算管理</span>
                      </div>
                      <div class="text-xs text-stone-500 mt-0.5 whitespace-nowrap">
                        現在 ${formatNum(st.currentQty)}${baseUnitStr} ／ 必要 ${formatNum(st.requiredQty)}${baseUnitStr}
                      </div>
                      <div class="text-[11px] text-[#1E6B9B] font-medium mt-1 leading-snug jp-wrap">
                        目安：${guideParts}
                      </div>
                    </div>
                  </label>
                  <div class="text-right shrink-0">
                    <span class="text-[11px] text-stone-400 block leading-none">あと</span>
                    <span class="font-bold text-rose-600 text-base whitespace-nowrap">${formatNum(needQtyNum)}${baseUnitStr}</span>
                  </div>
                </div>

                <div class="pt-2.5 border-t border-stone-200/70 space-y-2">
                  ${variantInputsHtml}
                  <div class="flex justify-end pt-1">
                    <button type="button" onclick="replenishMultiVariantItem('${item.id}')"
                      class="px-3.5 h-8 rounded-xl ${btnColor} text-white text-xs font-bold active:scale-95 transition shadow-2xs flex items-center gap-1 whitespace-nowrap shrink-0">
                      <i data-lucide="plus-circle" class="w-3.5 h-3.5 shrink-0"></i>
                      <span>補充</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }

          // 通常品目（375pxでも右端が絶対に切れない1行ステッパー）
          const needQty = formatNum(needQtyNum);
          const stepVal = item.step || (Number.isInteger(needQtyNum) ? 1 : 0.5);

          return `
            <div class="p-3.5 transition ${isChecked ? 'bg-stone-50/80 opacity-65' : 'bg-white'} min-w-0">
              <div class="flex items-start justify-between gap-2">
                <label class="flex items-start gap-2.5 cursor-pointer flex-1 min-w-0">
                  <input type="checkbox" onchange="toggleShoppingCheck('${item.id}')" ${isChecked ? 'checked' : ''}
                    class="mt-0.5 w-5 h-5 rounded-md border-stone-300 text-[#1B6B50] focus:ring-emerald-700 cursor-pointer shrink-0">
                  <div class="min-w-0">
                    <div class="font-bold text-stone-800 text-sm leading-snug ${isChecked ? 'line-through text-stone-400' : ''}">${item.name}</div>
                    <div class="text-xs text-stone-500 mt-0.5 whitespace-nowrap">
                      現在 ${formatNum(st.currentQty)}${item.unit} ／ 必要 ${formatNum(st.requiredQty)}${item.unit}
                    </div>
                  </div>
                </label>

                <div class="text-right shrink-0">
                  <span class="font-bold text-rose-600 text-sm whitespace-nowrap">あと ${needQty} ${item.unit}</span>
                </div>
              </div>

              <div class="mt-3 pt-2.5 border-t border-stone-100 flex items-center justify-between gap-1 min-w-0">
                <span class="text-[11px] font-medium text-stone-500 whitespace-nowrap shrink-0">購入数</span>

                <div class="flex items-center gap-1.5 shrink-0">
                  <div class="inline-flex items-center bg-stone-100 rounded-xl p-0.5 border border-stone-200/80 shrink-0">
                    <button type="button" onclick="stepShoppingInput('${item.id}', -${stepVal})"
                      class="w-7 h-7 rounded-lg bg-white text-stone-700 font-bold shadow-2xs flex items-center justify-center hover:bg-stone-50 active:scale-90 transition shrink-0" aria-label="減らす">
                      <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                    </button>
                    <input type="number" id="shop-qty-${item.id}" step="any" min="0.1" value="${needQtyNum}"
                      aria-label="${item.name}の購入数"
                      class="w-12 min-w-0 shrink-0 bg-transparent text-center font-bold text-stone-800 focus:outline-none px-0.5">
                    <span class="text-[11px] font-medium text-stone-500 pr-1 whitespace-nowrap shrink-0">${item.unit}</span>
                    <button type="button" onclick="stepShoppingInput('${item.id}', ${stepVal})"
                      class="w-7 h-7 rounded-lg bg-white text-stone-700 font-bold shadow-2xs flex items-center justify-center hover:bg-stone-50 active:scale-90 transition shrink-0" aria-label="増やす">
                      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>

                  <button type="button" onclick="replenishPartial('${item.id}')"
                    class="px-2.5 h-8 rounded-xl bg-[#1B6B50] text-white text-xs font-bold hover:bg-emerald-900 active:scale-95 transition shadow-2xs whitespace-nowrap shrink-0">
                    補充
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        groupsHtml += `
          <div class="bg-white rounded-2xl border border-stone-200/80 shadow-2xs overflow-hidden">
            <div class="${headerBg} px-4 py-2.5 border-b border-stone-200/70 flex items-center gap-2">
              <i data-lucide="${cat.icon}" class="w-4 h-4 ${iconColor} shrink-0"></i>
              <h3 class="font-bold text-xs">${cat.name}</h3>
            </div>
            <div class="divide-y divide-stone-100">
              ${rowsHtml}
            </div>
          </div>
        `;
      });

      const checkedCount = appState.checkedShoppingIds.filter(id => shortageItems.some(i => i.id === id)).length;

      container.innerHTML = `
        <div class="space-y-4 animate-fade-in min-w-0">
          <div class="bg-white p-4 rounded-2xl border border-stone-200/80 shadow-2xs space-y-2">
            <div class="flex items-center justify-between gap-2">
              <h2 class="font-bold text-stone-800 text-base">不足品リスト（${shortageItems.length}品目）</h2>
              ${checkedCount > 0 ? `
                <button type="button" onclick="replenishAllChecked()"
                  class="px-3 py-1.5 rounded-xl bg-[#1B6B50] text-white text-xs font-bold hover:bg-emerald-900 active:scale-95 transition shadow-2xs whitespace-nowrap shrink-0">
                  チェック済（${checkedCount}件）を補充
                </button>
              ` : ''}
            </div>
            <p class="text-xs text-stone-500 leading-relaxed jp-wrap">購入した数量を入力して「補充」を押すと在庫に反映されます（一部購入にも対応）</p>
          </div>

          <div class="space-y-4">
            ${groupsHtml}
          </div>
        </div>
      `;
    }

    function replenishAllChecked() {
      const targetIds = [...appState.checkedShoppingIds];
      let updatedCount = 0;

      targetIds.forEach(itemId => {
        const item = appState.items.find(i => i.id === itemId);
        if (!item) return;
        const st = getItemStats(item);
        if (st.isSufficient) return;

        if (st.isCombined && Array.isArray(item.variants) && item.variants.length > 0) {
          let addedAny = false;
          item.variants.forEach(v => {
            const el = document.getElementById(`shop-multi-${item.id}-${v.id}`);
            const addQty = Math.max(0, parseFloat(el?.value) || 0);
            if (addQty > 0) {
              v.stock = Math.round(((Number(v.stock) || 0) + addQty) * 10) / 10;
              addedAny = true;
            }
          });
          if (!addedAny) {
            const v0 = item.variants[0];
            const need = Math.abs(st.diffQty);
            const est = v0.factor > 0 ? Math.ceil(need / v0.factor) : 1;
            v0.stock = Math.round(((Number(v0.stock) || 0) + est) * 10) / 10;
          }
          updatedCount++;
        } else {
          const inputEl = document.getElementById(`shop-qty-${item.id}`);
          const addQty = inputEl ? (parseFloat(inputEl.value) || Math.abs(st.diffQty)) : Math.abs(st.diffQty);
          if (addQty > 0) {
            item.stock = Math.round(((Number(item.stock) || 0) + addQty) * 10) / 10;
            updatedCount++;
          }
        }
      });

      appState.checkedShoppingIds = appState.checkedShoppingIds.filter(id => {
        const it = appState.items.find(i => i.id === id);
        return it ? !getItemStats(it).isSufficient : false;
      });

      saveData();
      renderCurrentView();
      if (updatedCount > 0) {
        showToast(`${updatedCount}品目の購入分を在庫に一括補充しました！`);
      }
    }

    function stepMultiShopInput(itemId, variantId, delta) {
      const el = document.getElementById(`shop-multi-${itemId}-${variantId}`);
      if (!el) return;
      const cur = parseFloat(el.value) || 0;
      el.value = Math.max(0, Math.round((cur + delta) * 10) / 10);
    }

    function replenishMultiVariantItem(itemId) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item || !Array.isArray(item.variants)) return;

      let addedTotalBase = 0;
      item.variants.forEach(v => {
        const el = document.getElementById(`shop-multi-${item.id}-${v.id}`);
        const addQty = Math.max(0, parseFloat(el?.value) || 0);
        if (addQty > 0) {
          v.stock = Math.round(((Number(v.stock) || 0) + addQty) * 10) / 10;
          addedTotalBase += addQty * (Number(v.factor) || 1);
        }
      });

      if (addedTotalBase <= 0) {
        showToast('追加する数量を1つ以上入力してください', 'error');
        return;
      }

      const catObj = CATEGORIES.find(c => c.id === item.category);
      const isFood = catObj && catObj.type === 'food';
      const unitStr = isFood ? '食' : (item.totalUnit || item.unit);
      const updated = getItemStats(item);

      if (updated.isSufficient) {
        appState.checkedShoppingIds = appState.checkedShoppingIds.filter(id => id !== itemId);
        showToast(`「${item.name}」に+${formatNum(addedTotalBase)}${unitStr}補充し、目標を達成しました！`);
      } else {
        showToast(`「${item.name}」に+${formatNum(addedTotalBase)}${unitStr}補充しました（残り不足：${formatNum(Math.abs(updated.diffQty))}${unitStr}）`);
      }

      saveData();
      renderCurrentView();
    }

    function toggleShoppingCheck(itemId) {
      const idx = appState.checkedShoppingIds.indexOf(itemId);
      if (idx >= 0) appState.checkedShoppingIds.splice(idx, 1);
      else appState.checkedShoppingIds.push(itemId);
      saveData();
      renderShoppingView(document.getElementById('app'));
      if (window.lucide) lucide.createIcons();
    }

    function stepShoppingInput(itemId, delta) {
      const inputEl = document.getElementById(`shop-qty-${itemId}`);
      if (!inputEl) return;
      const currentVal = parseFloat(inputEl.value) || 0;
      inputEl.value = Math.max(0.1, Math.round((currentVal + delta) * 10) / 10);
    }

    function replenishPartial(itemId) {
      const item = appState.items.find(i => i.id === itemId);
      const inputEl = document.getElementById(`shop-qty-${itemId}`);
      if (!item || !inputEl) return;

      const addQty = parseFloat(inputEl.value);
      if (isNaN(addQty) || addQty <= 0) {
        showToast('0より大きい購入数量を入力してください', 'error');
        return;
      }

      item.stock = Math.round(((Number(item.stock) || 0) + addQty) * 10) / 10;
      const updatedStats = getItemStats(item);

      if (updatedStats.isSufficient) {
        appState.checkedShoppingIds = appState.checkedShoppingIds.filter(id => id !== itemId);
        showToast(`「${item.name}」に+${formatNum(addQty)}${item.unit}補充し、目標を達成しました！`);
      } else {
        const remain = formatNum(Math.abs(updatedStats.diffQty));
        showToast(`「${item.name}」に+${formatNum(addQty)}${item.unit}補充しました（残り不足：${remain}${item.unit}）`);
      }

      saveData();
      renderCurrentView();
    }

    function selectAllocationCategory(catId) {
      selectedAllocationCategory = catId;
      renderSettingsView(document.getElementById('app'));
      if (window.lucide) lucide.createIcons();
    }

    function updateItemShareRatio(itemId, rawValue) {
      const item = appState.items.find(i => i.id === itemId);
      if (!item) return;
      const val = Math.max(0, Math.min(100, parseInt(rawValue, 10) || 0));
      item.ratio = val;
      saveData();

      const catObj = CATEGORIES.find(c => c.id === item.category);
      const isAmber = catObj && catObj.theme === 'amber';
      const unitStr = isAmber ? '回' : '食';

      const st = getItemStats(item);
      const qtyHint = st.isCombined ? '複数規格合算' : `約${formatNum(st.requiredQty)}${item.unit}`;
      const labelEl = document.getElementById(`item-share-label-${item.id}`);
      if (labelEl) {
        labelEl.textContent = `${val}%（必要 ${st.targetMeals}${unitStr} / ${qtyHint}）`;
      }

      const catItems = appState.items.filter(i => i.category === item.category);
      const totalSum = Math.round(catItems.reduce((sum, i) => sum + (Number(i.ratio) || 0), 0));
      const totalAllocatedMeals = catItems.reduce((sum, i) => sum + getItemStats(i).targetMeals, 0);

      const totalMealsTextEl = document.getElementById('alloc-total-meals-text');
      if (totalMealsTextEl) {
        totalMealsTextEl.textContent = `${totalAllocatedMeals}${unitStr}`;
      }

      const totalBadge = document.getElementById('alloc-total-badge');
      if (totalBadge) {
        totalBadge.textContent = `${totalShareSumDisplay(totalSum)}`;
        totalBadge.className = `inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold whitespace-nowrap shrink-0 ${
          totalSum === 100 ? 'bg-emerald-200/80 text-[#1B6B50]' : 'bg-amber-200/80 text-amber-900'
        }`;
      }
    }

    function totalShareSumDisplay(sum) {
      return `${sum}%${sum === 100 ? '（ぴったり）' : ''}`;
    }

    function normalizeCategoryShares(catId) {
      const catItems = appState.items.filter(i => i.category === catId);
      if (catItems.length === 0) return;

      const currentSum = catItems.reduce((sum, i) => sum + (Number(i.ratio) || 0), 0);
      if (currentSum <= 0) {
        const equalShare = Math.floor(100 / catItems.length);
        let remainder = 100 - equalShare * catItems.length;
        catItems.forEach((item, idx) => {
          item.ratio = equalShare + (idx < remainder ? 1 : 0);
        });
      } else {
        let allocated = 0;
        catItems.forEach((item, idx) => {
          if (idx === catItems.length - 1) {
            item.ratio = Math.max(0, 100 - allocated);
          } else {
            const scaled = Math.round(((Number(item.ratio) || 0) / currentSum) * 100);
            item.ratio = scaled;
            allocated += scaled;
          }
        });
      }

      saveData();
      renderSettingsView(document.getElementById('app'));
      if (window.lucide) lucide.createIcons();
      showToast('合計100%になるよう比率を自動調整しました');
    }

    function updateFamilySetting(key, rawValue) {
      const val = Math.max(1, parseInt(rawValue, 10) || 1);
      appState.settings[key] = val;
      saveData();
      renderCurrentView();
      showToast('備蓄目標を更新しました');
    }

    function updateCategoryRatio(catId, rawValue) {
      const val = Math.max(0, Math.min(200, parseInt(rawValue, 10) || 0));
      appState.settings.categoryRatios[catId] = val;
      saveData();
      const isSnacks = catId === 'snacks';
      const targetMeals = getCategoryTargetMeals(catId);
      const eqDays = getCategoryEquivalentDays(val);

      const labelEl = document.getElementById(`ratio-label-${catId}`);
      if (labelEl) {
        labelEl.textContent = isSnacks
          ? `${val}%（必要 ${targetMeals}回分）`
          : `${val}%（約${eqDays}日分 / ${targetMeals}食）`;
      }
      if (selectedAllocationCategory === catId) {
        renderSettingsView(document.getElementById('app'));
        if (window.lucide) lucide.createIcons();
      }
    }

    function exportJsonBackup() {
      try {
        const dataStr = JSON.stringify(appState, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `bichiku_backup_${dateStr}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('JSONファイルをダウンロードしました');
      } catch (e) {
        showToast('バックアップの作成に失敗しました', 'error');
      }
    }

    function importJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.settings || !Array.isArray(parsed.items)) {
            throw new Error('不正なファイル形式です');
          }
          appState = {
            settings: { ...DEFAULT_DATA.settings, ...parsed.settings },
            checkedShoppingIds: parsed.checkedShoppingIds || [],
            items: parsed.items
          };
          saveData();
          renderCurrentView();
          showToast('JSONファイルからデータを復元しました！');
        } catch (err) {
          showToast('ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function confirmResetData() {
      showConfirmDialog(
        '初期データにリセット',
        '現在入力されている在庫数や設定がすべて初期状態に戻ります。よろしいですか？',
        () => {
          appState = JSON.parse(JSON.stringify(DEFAULT_DATA));
          saveData();
          renderCurrentView();
          showToast('初期データにリセットしました');
        }
      );
    }

    // ==========================================
    // 10. 品目追加・編集モーダル
    // ==========================================
    function openItemModal(itemId, defaultCatId = 'staple') {
      const isNew = !itemId;
      const found = !isNew ? appState.items.find(i => i.id === itemId) : null;
      const item = isNew || !found
        ? {
            id: 'item-' + Date.now(),
            category: defaultCatId,
            name: '',
            isCombined: false,
            unit: '個',
            totalUnit: 'L',
            stock: 0,
            mealsPerUnit: 1,
            ratio: 10,
            perPersonPerDay: 0.5,
            step: 1,
            expiry: '',
            variants: [
              { id: 'v-' + Date.now() + '-1', name: '2Lペットボトル', unit: '本', factor: 2, stock: 0, step: 1, expiry: '' },
              { id: 'v-' + Date.now() + '-2', name: '500mLペットボトル', unit: '本', factor: 0.5, stock: 0, step: 1, expiry: '' }
            ]
          }
        : JSON.parse(JSON.stringify(found));

      modalDraftVariants = Array.isArray(item.variants) && item.variants.length > 0
        ? item.variants
        : [
            { id: 'v-' + Date.now() + '-1', name: 'サイズ大（例: 2L）', unit: '本', factor: 2, stock: 0, step: 1, expiry: '' },
            { id: 'v-' + Date.now() + '-2', name: 'サイズ小（例: 500mL）', unit: '本', factor: 0.5, stock: 0, step: 1, expiry: '' }
          ];

      const modal = document.getElementById('item-modal');
      const titleEl = document.getElementById('modal-title');
      const bodyEl = document.getElementById('modal-body');

      titleEl.textContent = isNew ? '新しい備蓄品を追加' : '品目の詳細・編集';

      const catOptions = CATEGORIES.map(c =>
        `<option value="${c.id}" ${c.id === item.category ? 'selected' : ''}>${c.name}</option>`
      ).join('');

      const isPerPerson = item.perPersonPerDay !== undefined;
      const dailyRateVal = isPerPerson ? item.perPersonPerDay : (item.perHouseholdPerDay ?? 0.5);

      bodyEl.innerHTML = `
        <form id="item-form" onsubmit="saveItemForm(event, ${isNew})" class="space-y-4">
          <input type="hidden" name="id" value="${item.id}">
          <input type="hidden" name="ratio" value="${item.ratio || 10}">
          <input type="hidden" name="isCombined" id="modal-is-combined-input" value="${item.isCombined ? 'true' : 'false'}">

          <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">カテゴリー</label>
            <select name="category" id="modal-cat-select" onchange="updateModalVisibility()"
              class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2.5 font-medium text-stone-800 focus:outline-none focus:border-[#1B6B50]">
              ${catOptions}
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">品目名 <span class="text-rose-500">*</span></label>
            <input type="text" name="name" required value="${item.name}" placeholder="例：トマト缶、お茶ペットボトル"
              class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2.5 font-medium text-stone-800 focus:outline-none focus:border-[#1B6B50]">
          </div>

          <!-- 管理方式の切り替え -->
          <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200/80 space-y-2">
            <label class="block text-xs font-bold text-stone-600">数量の管理方法</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="mode-btn-single" onclick="setModalManageMode(false)"
                class="py-2 px-2 rounded-xl text-xs font-bold border transition text-center whitespace-nowrap">
                通常管理（1種類）
              </button>
              <button type="button" id="mode-btn-multi" onclick="setModalManageMode(true)"
                class="py-2 px-2 rounded-xl text-xs font-bold border transition text-center whitespace-nowrap">
                複数サイズ・規格合算
              </button>
            </div>
            <p class="text-[10px] text-stone-500 leading-snug jp-wrap">
              2Lと500mLなど異なるサイズを別々の本数で数え、合計量で管理したい場合は「複数サイズ・規格合算」を選びます。
            </p>
          </div>

          <!-- 【A】通常管理用フィールド -->
          <div id="single-mode-fields" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-stone-600 mb-1">現在庫数</label>
                <input type="number" step="0.1" min="0" name="stock" value="${item.stock ?? 0}"
                  class="w-full min-w-0 bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2.5 font-bold text-stone-900 focus:outline-none focus:border-[#1B6B50]">
              </div>
              <div>
                <label class="block text-xs font-bold text-stone-600 mb-1">単位</label>
                <input type="text" name="unit" id="single-unit-input" value="${item.unit || '個'}" placeholder="個"
                  class="w-full min-w-0 bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2.5 font-medium text-stone-800 focus:outline-none focus:border-[#1B6B50]">
              </div>
            </div>

            <!-- クイック単位チップ -->
            <div class="flex flex-wrap items-center gap-1.5 -mt-1.5">
              <span class="text-[11px] text-stone-400 mr-0.5">単位選択：</span>
              ${['個', '枚', '本', '束', '缶', '袋', '食', 'kg', 'L'].map(u => `
                <button type="button" onclick="document.getElementById('single-unit-input').value='${u}'"
                  class="px-2.5 py-1 rounded-lg bg-stone-100 hover:bg-emerald-50 hover:text-[#1B6B50] border border-stone-200 text-xs font-bold text-stone-700 transition">
                  ${u}
                </button>
              `).join('')}
            </div>

            <div id="single-food-rule" class="bg-emerald-50/70 p-3.5 rounded-2xl border border-emerald-200/70 space-y-2">
              <div class="text-xs font-bold text-[#1B6B50] flex items-center gap-1.5">
                <i data-lucide="calculator" class="w-4 h-4 shrink-0"></i>
                <span>食数（回数）の換算ルール</span>
              </div>
              <div>
                <label class="block text-[11px] text-stone-600 mb-1">1単位あたりの換算食数（回数）</label>
                <input type="number" step="0.01" min="0.1" name="mealsPerUnit" value="${item.mealsPerUnit || 1}"
                  class="w-full min-w-0 bg-white border border-stone-300 rounded-xl px-3 py-2 font-bold text-stone-800">
                <span class="text-[10px] text-stone-500 block mt-1 jp-wrap">例：トマト缶・大豆水煮1缶=2食 / サバ缶・コーン缶1缶=1食 / チョコ1個=0.5回</span>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-stone-600 mb-1">一番早い賞味期限（任意）</label>
              <div class="flex items-center gap-2 min-w-0">
                <input type="date" name="expiry" id="single-expiry-input" value="${item.expiry || ''}"
                  class="flex-1 min-w-0 bg-stone-50 border border-stone-300 rounded-xl px-3 py-2.5 font-medium text-stone-800">
                <button type="button" onclick="document.getElementById('single-expiry-input').value=''"
                  class="px-3 py-2.5 rounded-xl bg-stone-100 hover:bg-rose-50 text-stone-600 hover:text-rose-600 border border-stone-200 text-xs font-bold whitespace-nowrap shrink-0 transition">
                  × クリア
                </button>
              </div>
            </div>
          </div>

          <!-- 【B】複数サイズ・規格の合算管理用フィールド -->
          <div id="multi-mode-fields" class="hidden space-y-3.5">
            <div id="multi-supply-unit-box">
              <label class="block text-xs font-bold text-stone-600 mb-1">合算後の基準単位（L、本、枚など）</label>
              <input type="text" name="totalUnit" id="multi-base-unit-input" value="${item.totalUnit || item.unit || 'L'}" placeholder="L"
                oninput="renderModalVariantsList()"
                class="w-full min-w-0 bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2 font-bold text-stone-800">
            </div>

            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-stone-700">登録するサイズ・規格の内訳</span>
                <button type="button" onclick="addModalVariantRow()"
                  class="text-xs font-bold text-[#1B6B50] bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-2.5 py-1 rounded-lg flex items-center gap-1 whitespace-nowrap">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>規格を追加
                </button>
              </div>
              <div id="modal-variants-container" class="space-y-2.5">
                <!-- JSで描画 -->
              </div>
            </div>
          </div>

          <!-- 食品カテゴリー共通：配分比率リンク -->
          <div id="modal-food-share-link" class="bg-stone-50 p-3 rounded-2xl border border-stone-200/70 flex items-center justify-between gap-2">
            <div class="text-xs text-stone-600 whitespace-nowrap">
              カテゴリー内配分比率：<span class="font-bold text-[#1B6B50]">${item.ratio || 0}%</span>
            </div>
            <button type="button" onclick="jumpToCategoryAllocation(document.getElementById('modal-cat-select').value)"
              class="px-3 py-1.5 rounded-xl bg-white border border-emerald-300 text-[#1B6B50] text-xs font-bold hover:bg-emerald-100/70 transition flex items-center gap-1 shadow-2xs whitespace-nowrap shrink-0">
              <span>配分スライダーで調整</span>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 shrink-0"></i>
            </button>
          </div>

          <!-- 水・生活用品カテゴリー共通：必要量の自動計算基準 -->
          <div id="supply-specific-fields" class="hidden space-y-3 pt-2 border-t border-stone-100">
            <div class="bg-sky-50/80 p-3.5 rounded-2xl border border-sky-200/80 space-y-3">
              <div class="text-xs font-bold text-[#1E6B9B] flex items-center gap-1.5">
                <i data-lucide="calculator" class="w-4 h-4 shrink-0"></i>
                <span>必要量の自動計算基準</span>
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="block text-[11px] text-stone-600 mb-1">1日あたりの基準使用量</label>
                  <input type="number" step="0.05" min="0.05" name="dailyRate" value="${dailyRateVal}"
                    class="w-full min-w-0 bg-white border border-stone-300 rounded-xl px-3 py-2 font-bold text-stone-800">
                </div>
                <div>
                  <label class="block text-[11px] text-stone-600 mb-1">計算の単位</label>
                  <select name="rateScope" class="w-full min-w-0 bg-white border border-stone-300 rounded-xl px-2.5 py-2 font-medium text-stone-800">
                    <option value="person" ${isPerPerson ? 'selected' : ''}>1人あたり（人数を掛ける）</option>
                    <option value="household" ${!isPerPerson ? 'selected' : ''}>1世帯あたり（人数不問）</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="pt-3 flex items-center gap-3">
            ${!isNew ? `
              <button type="button" onclick="deleteItem('${item.id}')" class="p-3 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 transition shrink-0" title="削除">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
              </button>
            ` : ''}
            <button type="submit" class="flex-1 py-3 px-5 rounded-xl bg-[#1B6B50] text-white font-bold text-sm hover:bg-emerald-900 transition shadow-sm whitespace-nowrap">
              保存する
            </button>
          </div>
        </form>
      `;

      modal.classList.remove('hidden');
      renderModalVariantsList();
      updateModalVisibility();
      if (window.lucide) lucide.createIcons();
    }

    function setModalManageMode(isCombined) {
      const inputEl = document.getElementById('modal-is-combined-input');
      if (inputEl) inputEl.value = isCombined ? 'true' : 'false';
      updateModalVisibility();
    }

    function updateModalVisibility() {
      const catId = document.getElementById('modal-cat-select')?.value;
      const catObj = CATEGORIES.find(c => c.id === catId);
      const isFood = catObj && catObj.type === 'food';
      const isCombined = document.getElementById('modal-is-combined-input')?.value === 'true';

      const btnSingle = document.getElementById('mode-btn-single');
      const btnMulti = document.getElementById('mode-btn-multi');
      if (btnSingle && btnMulti) {
        if (!isCombined) {
          btnSingle.className = 'py-2 px-2 rounded-xl text-xs font-bold border bg-[#1B6B50] text-white border-[#1B6B50] transition text-center whitespace-nowrap';
          btnMulti.className = 'py-2 px-2 rounded-xl text-xs font-bold border bg-white text-stone-600 border-stone-300 hover:bg-stone-100 transition text-center whitespace-nowrap';
        } else {
          btnSingle.className = 'py-2 px-2 rounded-xl text-xs font-bold border bg-white text-stone-600 border-stone-300 hover:bg-stone-100 transition text-center whitespace-nowrap';
          btnMulti.className = 'py-2 px-2 rounded-xl text-xs font-bold border bg-[#1B6B50] text-white border-[#1B6B50] transition text-center whitespace-nowrap';
        }
      }

      document.getElementById('single-mode-fields')?.classList.toggle('hidden', isCombined);
      document.getElementById('multi-mode-fields')?.classList.toggle('hidden', !isCombined);

      document.getElementById('single-food-rule')?.classList.toggle('hidden', !isFood);
      document.getElementById('multi-supply-unit-box')?.classList.toggle('hidden', isFood);
      document.getElementById('modal-food-share-link')?.classList.toggle('hidden', !isFood);
      document.getElementById('supply-specific-fields')?.classList.toggle('hidden', isFood);

      renderModalVariantsList();
    }

    function renderModalVariantsList() {
      const container = document.getElementById('modal-variants-container');
      if (!container) return;

      const catId = document.getElementById('modal-cat-select')?.value;
      const catObj = CATEGORIES.find(c => c.id === catId);
      const isFood = catObj && catObj.type === 'food';
      const baseUnit = isFood ? '食' : (document.getElementById('multi-base-unit-input')?.value.trim() || 'L');

      container.innerHTML = modalDraftVariants.map((v, idx) => `
        <div class="p-3 rounded-2xl border border-stone-200 bg-stone-50/70 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[11px] font-bold text-stone-500">規格 #${idx + 1}</span>
            ${modalDraftVariants.length > 1 ? `
              <button type="button" onclick="removeModalVariantRow(${idx})" class="text-[11px] text-rose-600 hover:underline font-medium">削除</button>
            ` : ''}
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div class="col-span-2">
              <label class="block text-[10px] font-bold text-stone-500 mb-0.5">規格名（例: 2Lペット）</label>
              <input type="text" value="${v.name}" oninput="updateDraftVariant(${idx}, 'name', this.value)"
                class="w-full min-w-0 bg-white border border-stone-300 rounded-xl px-2.5 py-1.5 font-bold text-stone-800">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-stone-500 mb-0.5">数える単位</label>
              <input type="text" value="${v.unit}" oninput="updateDraftVariant(${idx}, 'unit', this.value)" placeholder="本"
                class="w-full min-w-0 bg-white border border-stone-300 rounded-xl px-2.5 py-1.5 font-bold text-stone-800">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-stone-500 mb-0.5">1${v.unit || '単位'}あたりの${baseUnit}</label>
              <input type="number" step="0.01" min="0.01" value="${v.factor}" oninput="updateDraftVariant(${idx}, 'factor', this.value)"
                class="w-full min-w-0 bg-white border border-stone-300 rounded-xl px-2.5 py-1.5 font-bold text-stone-800">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-stone-500 mb-0.5">現在庫（${v.unit || '本'}）</label>
              <input type="number" step="0.1" min="0" value="${v.stock}" oninput="updateDraftVariant(${idx}, 'stock', this.value)"
                class="w-full min-w-0 bg-white border border-stone-300 rounded-xl px-2.5 py-1.5 font-bold text-stone-800">
            </div>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-stone-500 mb-0.5">一番早い賞味期限（任意）</label>
            <div class="flex items-center gap-1.5 min-w-0">
              <input type="date" id="draft-variant-expiry-${idx}" value="${v.expiry || ''}"
                oninput="updateDraftVariant(${idx}, 'expiry', this.value)"
                class="flex-1 min-w-0 bg-white border border-stone-300 rounded-xl px-2.5 py-1.5 font-medium text-stone-800">
              <button type="button" onclick="clearDraftVariantExpiry(${idx})"
                class="px-2.5 py-1.5 rounded-xl bg-white hover:bg-rose-50 text-stone-600 hover:text-rose-600 border border-stone-300 text-xs font-bold whitespace-nowrap shrink-0 transition">
                × クリア
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function clearDraftVariantExpiry(index) {
      if (!modalDraftVariants[index]) return;
      modalDraftVariants[index].expiry = '';
      const el = document.getElementById(`draft-variant-expiry-${index}`);
      if (el) el.value = '';
    }

    function updateDraftVariant(index, field, value) {
      if (!modalDraftVariants[index]) return;
      if (field === 'factor' || field === 'stock') {
        modalDraftVariants[index][field] = parseFloat(value) || 0;
      } else {
        modalDraftVariants[index][field] = value;
      }
      if (field === 'unit') {
        renderModalVariantsList();
      }
    }

    function addModalVariantRow() {
      modalDraftVariants.push({
        id: 'v-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        name: '新しい規格',
        unit: '本',
        factor: 1,
        stock: 0,
        step: 1,
        expiry: ''
      });
      renderModalVariantsList();
    }

    function removeModalVariantRow(index) {
      if (modalDraftVariants.length <= 1) return;
      modalDraftVariants.splice(index, 1);
      renderModalVariantsList();
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    function saveItemForm(event, isNew) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const id = formData.get('id');
      const category = formData.get('category');
      const name = formData.get('name').trim();
      const isCombined = formData.get('isCombined') === 'true';
      const ratio = parseFloat(formData.get('ratio')) || 10;
      const dailyRate = parseFloat(formData.get('dailyRate')) || 0.5;
      const rateScope = formData.get('rateScope');

      const catObj = CATEGORIES.find(c => c.id === category);
      const isFood = catObj && catObj.type === 'food';

      const itemPayload = {
        id,
        category,
        name,
        isCombined,
        ratio,
        step: 1
      };

      if (!isFood) {
        if (rateScope === 'person') itemPayload.perPersonPerDay = dailyRate;
        else itemPayload.perHouseholdPerDay = dailyRate;
      }

      if (isCombined) {
        const cleanedVariants = modalDraftVariants.map(v => ({
          id: v.id || ('v-' + Date.now() + '-' + Math.random()),
          name: (v.name || '規格').trim(),
          unit: (v.unit || '個').trim(),
          factor: Math.max(0.01, Number(v.factor) || 1),
          stock: Math.max(0, Number(v.stock) || 0),
          step: v.step || 1,
          expiry: v.expiry || ''
        }));

        itemPayload.totalUnit = isFood ? '食' : (formData.get('totalUnit')?.trim() || 'L');
        itemPayload.unit = itemPayload.totalUnit;
        itemPayload.variants = cleanedVariants;
        itemPayload.stock = 0;
        itemPayload.mealsPerUnit = 1;
        itemPayload.expiry = '';
      } else {
        itemPayload.unit = formData.get('unit')?.trim() || '個';
        itemPayload.stock = Math.max(0, parseFloat(formData.get('stock')) || 0);
        itemPayload.mealsPerUnit = Math.max(0.01, parseFloat(formData.get('mealsPerUnit')) || 1);
        itemPayload.expiry = formData.get('expiry') || '';
        itemPayload.variants = [];
      }

      if (isNew) {
        appState.items.push(itemPayload);
        showToast(`「${name}」を追加しました`);
      } else {
        const idx = appState.items.findIndex(i => i.id === id);
        if (idx >= 0) {
          const prev = appState.items[idx];
          appState.items[idx] = { ...prev, ...itemPayload, step: prev.step || 1 };
        }
        showToast(`「${name}」を更新しました`);
      }

      saveData();
      closeItemModal();
      renderCurrentView();
    }

    function deleteItem(itemId) {
      const target = appState.items.find(i => i.id === itemId);
      if (!target) return;
      closeItemModal();
      showConfirmDialog(
        '品目の削除',
        `「${target.name}」を備蓄リストから削除しますか？`,
        () => {
          appState.items = appState.items.filter(i => i.id !== itemId);
          saveData();
          renderCurrentView();
          showToast(`「${target.name}」を削除しました`);
        }
      );
    }

    // ==========================================
    // 11. ユーティリティ
    // ==========================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass = type === 'error' ? 'bg-rose-700 text-white' : 'bg-stone-800 text-white';
      toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-lg text-xs font-medium flex items-center justify-center text-center animate-fade-in jp-wrap`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function showConfirmDialog(title, message, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;

      const cancelBtn = document.getElementById('confirm-cancel-btn');
      const okBtn = document.getElementById('confirm-ok-btn');

      const close = () => modal.classList.add('hidden');

      cancelBtn.onclick = close;
      okBtn.onclick = () => {
        close();
        onConfirm();
      };

      modal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentView();
    });
  </script>
</body>
</html>
